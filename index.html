<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Прогнозы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>

/* ===== Battle ===== */
.battle-result {
  padding: 18px 14px;
  border-radius: 14px;
  text-align: center;
  margin-bottom: 12px;
}
.battle-result.win {
  background: linear-gradient(135deg, rgba(0,230,118,.2), rgba(0,230,118,.05));
  border: 2px solid var(--win);
}
.battle-result.lose {
  background: linear-gradient(135deg, rgba(255,59,48,.2), rgba(255,59,48,.05));
  border: 2px solid var(--lose);
}
.battle-result.draw {
  background: linear-gradient(135deg, rgba(255,204,0,.2), rgba(255,204,0,.05));
  border: 2px solid #ffcc00;
}
.battle-outcome {
  font-size: 20px;
  font-weight: 900;
  margin-bottom: 14px;
}
.battle-vs {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.battle-side {
  flex: 1;
  min-width: 0;
}
.battle-side-label {
  font-size: 11px;
  color: var(--hint);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 4px;
}
.battle-side-team {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.battle-side-power {
  font-size: 22px;
  font-weight: 900;
  color: var(--accent);
}
.battle-vs-badge {
  font-size: 14px;
  font-weight: 800;
  color: var(--hint);
  flex-shrink: 0;
}
.battle-xp {
  margin-top: 12px;
  font-size: 18px;
  font-weight: 800;
  color: var(--accent);
}

/* ===== Team Builder ===== */
.team-builder-modal { max-height: 92vh !important; }

.tb-field {
  background: linear-gradient(180deg, #0a2a10 0%, #0f1115 100%);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 8px;
  margin-bottom: 12px;
}
.tb-row {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 10px;
}
.tb-row:last-child { margin-bottom: 0; }

.tb-slot {
  width: 56px;
  height: 68px;
  background: rgba(255,255,255,.04);
  border: 2px solid var(--line);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: .15s;
}
.tb-slot:active { transform: scale(.94); }
.tb-slot-empty { border-style: dashed; }
.tb-slot-plus { font-size: 22px; color: var(--hint); }
.tb-slot-label {
  font-size: 8px;
  font-weight: 700;
  color: var(--hint);
  letter-spacing: .5px;
  margin-top: 2px;
}
.tb-slot-ovr {
  font-size: 14px;
  font-weight: 900;
  line-height: 1;
}
.tb-slot-name {
  font-size: 9px;
  font-weight: 700;
  color: var(--text);
  margin-top: 1px;
  max-width: 52px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tb-slot-filled .tb-slot-label { color: var(--text); opacity: .7; }

.tb-coach-block { margin-bottom: 12px; }
.tb-coach-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--hint);
  font-weight: 700; margin-bottom: 6px;
}
.tb-coach {
  display: flex; align-items: center; justify-content: center;
  padding: 12px;
  background: var(--bg2);
  border: 2px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  gap: 12px;
  transition: .15s;
}
.tb-coach:active { transform: scale(.98); }
.tb-coach-empty { border-style: dashed; flex-direction: column; }
.tb-coach-plus { font-size: 26px; color: var(--hint); }
.tb-coach-lbl { font-size: 11px; color: var(--hint); margin-top: 4px; }
.tb-coach-ovr { font-size: 20px; font-weight: 900; }
.tb-coach-name { font-size: 14px; font-weight: 700; }

.tb-info { display: flex; gap: 8px; margin-bottom: 12px; }
.tb-info-box {
  flex: 1; text-align: center;
  background: var(--bg2); border-radius: 12px;
  padding: 10px 4px;
}
.tb-info-box .num { font-size: 18px; font-weight: 800; color: var(--accent); }
.tb-info-box .lbl {
  font-size: 10px; color: var(--hint);
  margin-top: 2px; text-transform: uppercase;
  letter-spacing: .5px;
}

/* Card Picker */
.cp-list {
  display: flex; flex-direction: column; gap: 6px;
  max-height: 50vh; overflow-y: auto;
  margin-bottom: 12px;
}
.cp-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--bg2);
  border: 2px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
}
.cp-item:active { transform: scale(.98); }
.cp-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: #fff;
  position: relative; flex-shrink: 0;
}
.cp-flag {
  position: absolute; bottom: -2px; right: -2px; font-size: 12px;
}
.cp-body { flex: 1; min-width: 0; }
.cp-name { font-size: 14px; font-weight: 700; }
.cp-meta { font-size: 11px; color: var(--hint); margin-top: 2px; }
.cp-ovr { font-size: 18px; font-weight: 900; flex-shrink: 0; }
.cp-remove-btn {
  width: 100%; padding: 10px;
  background: rgba(255,59,48,.15);
  border: 1px solid var(--lose);
  color: var(--lose);
  border-radius: 10px;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
}

/* ============================================================
   ТЁМНАЯ ПРЕМИУМ-ТЕМА (по умолчанию) + ЯРКИЙ ЛАЙМОВЫЙ АКЦЕНТ
   ============================================================ */
:root {
  /* Тёмная премиум-палитра (по умолчанию) */
  --bg:      #0f1115;   /* почти чёрный, не серый */
  --bg2:     #1a1d24;   /* карточки */
  --bg3:     #23272f;   /* поднятые элементы */
  --text:    #e8eaed;
  --hint:    #9aa0a6;
  --accent:  #00e676;   /* лаймовый — основной акцент */
  --accent2: #00e6761a; /* 10% прозрачности для фонов */
  --line:    #2a2e36;
  --win:     #00e676;
  --lose:    #ff3b30;

  /* Размеры */
  --fs-h1:    20px;
  --fs-h2:    18px;
  --fs-h3:    15px;
  --fs-label: 13px;
  --fs-num:   20px;
  --fs-num-sm:16px;
  --fs-meta:  11px;

  /* Веса */
  --fw-reg:   500;
  --fw-med:   600;
  --fw-bold:  700;
  --fw-black: 800;

  --lh-tight: 1.2;
  --lh-base:  1.4;
  --ls-meta:  .5px;
  --ls-tight: -.2px;
}

/* Светлая тема (опционально, по кнопке ☀️) */
body.light {
  --bg:#ffffff; --bg2:#f5f5f7; --text:#0f1115; --hint:#6b7280;
  --accent:#00a844; --accent2:#00a84418; --line:#e5e7eb;
  --win:#00a844; --lose:#ff3b30;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:var(--lh-base); overflow-x:hidden; }
body { padding-bottom:76px; }

/* ===== Заголовки ===== */
.header { position:sticky; top:0; z-index:10; background:var(--bg);
  padding:14px 16px 10px; border-bottom:1px solid var(--line); }
.header h1 {
  margin:0;
  font-size:var(--fs-h1);
  font-weight:var(--fw-bold);
  letter-spacing:var(--ls-tight);
  line-height:var(--lh-tight);
}
.header .sub {
  color:var(--hint);
  font-size:var(--fs-label);
  font-weight:var(--fw-reg);
  margin-top:3px;
}

.content { padding:12px 12px 20px; }

.card { background:var(--bg2); border-radius:14px; padding:14px; margin-bottom:10px; }
.card h3,
.pf-section-title,
.tasks-section-title,
.um-section h4 {
  margin:0 0 10px;
  font-size:var(--fs-meta);
  font-weight:var(--fw-bold);
  text-transform:uppercase;
  letter-spacing:var(--ls-meta);
  color:var(--hint);
}

/* ===== Рейтинг ===== */
.rating-row { display:flex; align-items:center; gap:10px;
  padding:12px 14px; background:var(--bg2); border-radius:12px; margin-bottom:8px; }

/* Топ-1/2/3 — тёмная версия (по умолчанию) */
.rating-row.top1 { background:linear-gradient(135deg,#4a3a00,#7a5f00); color:#fff; }
.rating-row.top2 { background:linear-gradient(135deg,#333338,#45454c); color:#fff; }
.rating-row.top3 { background:linear-gradient(135deg,#3d2d1a,#5c4527); color:#fff; }

/* Топ-1/2/3 — светлая версия */
body.light .rating-row.top1 { background:linear-gradient(135deg,#fff7e0,#ffe9a8); color:#000; }
body.light .rating-row.top2 { background:linear-gradient(135deg,#f0f0f5,#e0e0e8); color:#000; }
body.light .rating-row.top3 { background:linear-gradient(135deg,#fbe9d4,#f5d5b3); color:#000; }

.rating-row .rank {
  font-size:var(--fs-num);
  font-weight:var(--fw-bold);
  width:32px; text-align:center;
  line-height:1.1;
}
.rating-row .name {
  flex:1;
  font-weight:var(--fw-med);
  font-size:14px;
}
.rating-row .points {
  font-weight:var(--fw-bold);
  font-size:var(--fs-h2);
  letter-spacing:var(--ls-tight);
  color:var(--accent);
}
body.light .rating-row .points { color:var(--accent); }
.rating-row .leagues {
  font-size:var(--fs-meta);
  color:var(--hint);
  margin-top:2px;
  letter-spacing:var(--ls-meta);
}

.league-tabs { display:flex; gap:6px; overflow-x:auto; padding:10px 12px;
  position:sticky; top:62px; background:var(--bg); z-index:9;
  border-bottom:1px solid var(--line); scrollbar-width:none; }
.league-tabs::-webkit-scrollbar { display:none; }
.league-tab { padding:8px 12px; background:var(--bg2); border-radius:20px;
  white-space:nowrap; font-size:14px; font-weight:var(--fw-med); cursor:pointer;
  border:2px solid transparent; transition:.15s; }
.league-tab.active { background:var(--accent2); color:var(--accent); border-color:var(--accent); }

/* ===== Иконка команды (крест) ===== */
.team-crest {
  display: inline-block;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  vertical-align: -3px;
  margin-right: 6px;
  object-fit: contain;
  background: #fff;
  flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08);
}
body.light .team-crest {
  box-shadow: 0 0 0 1px rgba(0,0,0,.06);
  background: var(--bg);
}
.team-crest-fallback {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  vertical-align: -3px;
  margin-right: 6px;
  font-size: 10px;
  font-weight: var(--fw-bold);
  color: #0f1115;
  background: var(--accent);
  flex-shrink: 0;
  text-transform: uppercase;
  letter-spacing: .2px;
  line-height: 1;
  user-select: none;
}
.match-teams-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 0;
  font-size: 14px;
  font-weight: var(--fw-med);
  line-height: 1.25;
}
.match-teams-row .team {
  display: inline-flex;
  align-items: center;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.match-teams-row .vs {
  color: var(--hint);
  font-weight: var(--fw-reg);
  flex-shrink: 0;
}
.pred-teams {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 4px;
  font-size: 14px;
  font-weight: var(--fw-med);
}
.pred-teams .team { display: inline-flex; align-items: center; }
.pred-teams .vs { color: var(--hint); font-weight: var(--fw-reg); }

/* ============================================================
   КАРТОЧКА МАТЧА — КОМПАКТНАЯ (букмекерский стиль)
   ============================================================ */
.match-card {
  background: var(--bg2);
  border-radius: 12px;
  padding: 8px 10px;
  margin-bottom: 6px;
  border: 1px solid transparent;
  transition: border-color .15s, background .15s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
}
.match-card.expanded { border-color: var(--accent); background: var(--accent2); }
.match-card.done { background: rgba(0,230,118,.06); border-color: rgba(0,230,118,.25); }

.match-head { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }

.match-time {
  font-size: 10px;
  font-weight: 700;
  color: var(--hint);
  letter-spacing: .3px;
  text-transform: uppercase;
  white-space: nowrap;
  line-height: 1;
}
.match-card.expanded .match-time { color: var(--accent); }

.match-teams-row { font-size:13px; font-weight:600; line-height:1.2; }

/* Кнопки П1 / X / П2 — маленькие */
.odds-row { display:flex; gap:4px; flex-shrink:0; }
.odds-btn {
  min-width: 40px;
  height: 36px;
  padding: 0 6px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: .12s;
  text-align: center;
  line-height: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
}
.odds-btn .odds-label { display:block; font-size:12px; font-weight:800; line-height:1; }
.odds-btn .odds-sub {
  display:block; font-size:8px; font-weight:500; color:var(--hint);
  margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:44px; text-transform:uppercase; letter-spacing:.2px;
}
.odds-btn:active { transform: scale(.94); }
.odds-btn.selected { background: var(--accent); color: #0f1115; border-color: var(--accent); }
.odds-btn.selected .odds-sub { color: rgba(15,17,21,.75); }

/* Инлайн ввод счёта */
.score-inline { display:flex; align-items:center; gap:3px; flex-shrink:0; }
.score-inline input {
  width: 26px; height: 32px; padding: 0;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
  border-radius: 6px; font-size: 14px; font-weight: 800; text-align: center;
  -moz-appearance: textfield;
}
.score-inline input::-webkit-outer-spin-button,
.score-inline input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.score-inline input:focus { outline:none; border-color:var(--accent); background:var(--accent2); }
.score-inline .score-colon { font-weight:800; color:var(--hint); font-size:12px; line-height:1; }
.score-inline .score-save {
  width: 32px; height: 32px; padding: 0;
  background: var(--accent); color: #0f1115;
  border: none; border-radius: 6px; font-size: 14px; font-weight: 900;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.score-inline .score-save:active { transform: scale(.9); }

/* Галочка «прогноз сделан» */
.pred-done-mini {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(0,230,118,.15);
  border: 1px solid var(--win);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--win); flex-shrink: 0;
}

/* Плашка «матч начался» */
.match-locked {
  font-size: 10px; color: var(--hint);
  padding: 4px 8px;
  background: var(--bg);
  border: 1px dashed var(--line);
  border-radius: 6px;
  text-align: center;
  flex-shrink: 0;
  font-weight: 600;
}

/* Старый big pred-done — скрываем в списке матчей */
.match-card .pred-done { display: none; }

.pred-done {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 3px solid var(--win);
  border-radius: 8px;
  padding: 7px 10px;
}
.pred-done-left { display: flex; flex-direction: column; min-width: 0; }
.pred-done-label {
  font-size: var(--fs-meta);
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
  color: var(--hint);
  font-weight: var(--fw-bold);
}
.pred-done-value {
  font-size: 13px;
  font-weight: var(--fw-bold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pred-done-check {
  font-size: 16px;
  color: var(--win);
  flex-shrink: 0;
}

.pred-row { background:var(--bg2); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
.pred-row .match { font-weight:var(--fw-med); margin-bottom:4px; font-size:14px; }
.pred-row .meta {
  font-size:var(--fs-meta);
  color:var(--hint);
  margin-bottom:6px;
  letter-spacing:var(--ls-meta);
}
.pred-row .guess { font-size:14px; margin-bottom:4px; }
.pred-row .result { font-size:13px; font-weight:var(--fw-med); }
.pred-row .result.pending { color:var(--hint); }
.pred-row .result b { font-weight:var(--fw-bold); }
.pred-row.pred-row-latest {
  border: 2px solid var(--accent);
  background: var(--accent2);
}
.pred-row .pred-latest-badge {
  display: inline-block;
  font-size: var(--fs-meta);
  font-weight: var(--fw-bold);
  color: #0f1115;
  background: var(--accent);
  padding: 3px 8px;
  border-radius: 10px;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}

.profile-header { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.profile-header .avatar { width:64px; height:64px; border-radius:50%;
  background:var(--accent); color:#0f1115; display:flex; align-items:center;
  justify-content:center; font-size:26px; font-weight:var(--fw-bold); flex-shrink:0; }
.profile-header .info h2 { margin:0 0 2px; font-size:var(--fs-h2); font-weight:var(--fw-bold); }
.profile-header .info .uname { color:var(--hint); font-size:var(--fs-label); }

.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.stat-box { background:var(--bg2); border-radius:12px; padding:12px; text-align:center; }
.stat-box .num {
  font-size:var(--fs-num);
  font-weight:var(--fw-black);
  line-height:1.1;
  letter-spacing:var(--ls-tight);
}
.stat-box .lbl {
  font-size:var(--fs-meta);
  color:var(--hint);
  margin-top:3px;
  text-transform:uppercase;
  letter-spacing:var(--ls-meta);
}

.ach-list { display:flex; flex-wrap:wrap; gap:6px; }
.ach-badge {
  padding:6px 10px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:20px;
  font-size:12px;
  font-weight:var(--fw-reg);
}

/* ============================================================
   НИЖНЯЯ НАВИГАЦИЯ — с SVG-иконками
   ============================================================ */
.nav { position:fixed; bottom:0; left:0; right:0; display:flex;
  background:var(--bg); border-top:1px solid var(--line); z-index:20;
  padding-bottom:env(safe-area-inset-bottom); }
.nav-item {
  flex:1;
  padding:8px 2px 10px;
  text-align:center;
  cursor:pointer;
  transition:color .15s;
  color:var(--hint);
  font-size: 10px; /* Уменьшили для 6 вкладок */
  font-weight:var(--fw-reg);
  position:relative;
  -webkit-tap-highlight-color:transparent;
}
.nav-item .ico {
  display: block;
  width: 22px; /* Уменьшили иконку */
  height: 22px;
  margin: 0 auto 3px;
  line-height: 0;
}
.nav-item .ico svg {
  width: 100%;
  height: 100%;
  display: block;
  transition: transform .2s cubic-bezier(.34,1.4,.64,1),
              filter .2s;
}
.nav-item.active { color:var(--accent); font-weight:var(--fw-med); }
.nav-item.active .ico svg {
  transform: scale(1.12) translateY(-1px);
  filter: drop-shadow(0 0 6px var(--accent));
}
.nav-item:active .ico svg {
  transform: scale(.92);
  transition-duration: .08s;
}

.loader { text-align:center; padding:40px 20px; color:var(--hint); font-size:var(--fs-label); }
.spinner { display:inline-block; width:28px; height:28px;
  border:3px solid var(--line); border-top-color:var(--accent);
  border-radius:50%; animation:spin .7s linear infinite; margin-bottom:10px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ===== Skeleton-загрузка ===== */
.skel { background: var(--bg2); border-radius: 12px; position: relative; overflow: hidden; }
.skel::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.08) 50%, transparent 100%);
  transform: translateX(-100%); animation: skelShimmer 1.3s infinite;
}
body.light .skel::after {
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%);
}
@keyframes skelShimmer { 100% { transform: translateX(100%); } }

.skel-rating-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; background: var(--bg2); border-radius: 12px;
  margin-bottom: 8px; position: relative; overflow: hidden;
}
.skel-rating-row::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.08) 50%, transparent 100%);
  transform: translateX(-100%); animation: skelShimmer 1.3s infinite;
}
body.light .skel-rating-row::after {
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%);
}
.skel-rating-row .skel-rank { width: 32px; height: 20px; border-radius: 6px; background: var(--line); flex-shrink: 0; }
.skel-rating-row .skel-body { flex: 1; min-width: 0; }
.skel-rating-row .skel-name { height: 14px; width: 60%; border-radius: 6px; background: var(--line); margin-bottom: 6px; }
.skel-rating-row .skel-leagues { height: 10px; width: 40%; border-radius: 6px; background: var(--line); }
.skel-rating-row .skel-points { width: 40px; height: 20px; border-radius: 6px; background: var(--line); flex-shrink: 0; }

.skel-match-card {
  background: var(--bg2); border-radius: 10px; padding: 10px 12px;
  margin-bottom: 6px; position: relative; overflow: hidden;
}
.skel-match-card .skel-time { height: 10px; width: 25%; border-radius: 6px; background: var(--line); margin-bottom: 8px; }
.skel-match-card .skel-teams { height: 14px; width: 70%; border-radius: 6px; background: var(--line); margin-bottom: 10px; }
.skel-match-card .skel-odds { display: flex; gap: 4px; }
.skel-match-card .skel-odds > div { flex: 1; height: 32px; border-radius: 8px; background: var(--line); }

.skel-pred-row {
  background: var(--bg2); border-radius: 12px; padding: 12px 14px;
  margin-bottom: 8px; position: relative; overflow: hidden;
}
.skel-pred-row::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.08) 50%, transparent 100%);
  transform: translateX(-100%); animation: skelShimmer 1.3s infinite;
}
body.light .skel-pred-row::after {
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%);
}
.skel-pred-row .skel-line-1 { height: 14px; width: 70%; border-radius: 6px; background: var(--line); margin-bottom: 6px; }
.skel-pred-row .skel-line-2 { height: 10px; width: 45%; border-radius: 6px; background: var(--line); margin-bottom: 8px; }
.skel-pred-row .skel-line-3 { height: 12px; width: 55%; border-radius: 6px; background: var(--line); }

.skel-profile-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.skel-profile-header .skel-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
.skel-profile-header .skel-lines { flex: 1; }
.skel-profile-header .skel-lines > div { height: 14px; border-radius: 6px; background: var(--line); margin-bottom: 8px; }
.skel-profile-header .skel-lines > div:first-child { width: 50%; }
.skel-profile-header .skel-lines > div:last-child { width: 35%; height: 10px; }

.skel-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.skel-stat-box { height: 68px; border-radius: 12px; background: var(--line); position: relative; overflow: hidden; }
.skel-stat-box::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.08) 50%, transparent 100%);
  transform: translateX(-100%); animation: skelShimmer 1.3s infinite;
}
body.light .skel-stat-box::after {
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%);
}

.toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
  background:#222; color:#fff; padding:10px 18px; border-radius:12px;
  font-size:14px; font-weight:var(--fw-reg); z-index:100; opacity:0; pointer-events:none;
  transition:.25s; max-width:90vw; text-align:center; }
.toast.show { opacity:1; }
.toast.error { background:var(--lose); }
.toast.success { background:var(--win); color:#0f1115; }

.empty { text-align:center; padding:30px 20px; color:var(--hint); font-size:var(--fs-label); }

.error-box { background:#fff3f3; border:2px solid #ff6b6b; border-radius:16px;
  padding:24px; margin:20px; text-align:center; color:#000; }
.error-box .icon { font-size:56px; margin-bottom:12px; }
.error-box h2 { color:#ff3b30; margin:0 0 12px; font-size:var(--fs-h1); font-weight:var(--fw-bold); }
.error-box p { color:#555; font-size:14px; line-height:1.6; margin:8px 0; }
.error-box code { background:#f0f0f0; padding:3px 8px; border-radius:6px;
  font-size:12px; font-family: monospace; }
.error-box .step { background:#fff; padding:12px; border-radius:10px;
  margin:10px 0; text-align:left; border-left: 4px solid var(--accent); }

/* --- Модальное окно --- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.65);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-backdrop.show { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--bg); width: 100%; max-width: 560px;
  border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  max-height: 80vh; overflow-y: auto; transform: translateY(20px);
  transition: transform .2s;
  border-top: 1px solid var(--line);
}
.modal-backdrop.show .modal { transform: translateY(0); }
.modal .modal-head {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom: 6px;
}
.modal .modal-head h3 { margin:0; font-size:var(--fs-h2); font-weight:var(--fw-bold); }
.modal .modal-close {
  border:none; background:var(--bg2); color:var(--text);
  width:32px; height:32px; border-radius:50%; font-size:18px; cursor:pointer;
}
.modal .modal-sub { color: var(--hint); font-size:var(--fs-label); margin-bottom:12px; }

.cmp-row {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; background:var(--bg2); border-radius:10px;
  margin-bottom:6px;
}
.cmp-row.me { background:var(--accent2); border:2px solid var(--accent); }
.cmp-row .cmp-name { flex:1; font-weight:var(--fw-med); font-size:14px; }
.cmp-row .cmp-outcome { font-size:var(--fs-label); color:var(--hint); margin-top:2px; }
.cmp-row .cmp-score {
  font-weight:var(--fw-bold); font-size:var(--fs-h3); padding:4px 10px;
  background:var(--bg); border-radius:8px; border:1px solid var(--line);
}

.stat-cmp {
  background: var(--bg2);
  border-radius: 12px;
  padding: 12px 12px 10px;
  margin-bottom: 12px;
}
.stat-cmp-title {
  font-size: var(--fs-meta);
  color: var(--hint);
  margin-bottom: 8px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}
.stat-cmp-row { display: flex; gap: 8px; margin-bottom: 10px; }
.stat-cmp-item {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 4px;
  text-align: center;
}
.stat-cmp-item .stat-cmp-label {
  font-size: var(--fs-meta);
  color: var(--hint);
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}
.stat-cmp-item .stat-cmp-val {
  font-size: var(--fs-num);
  font-weight: var(--fw-black);
  margin: 2px 0;
  letter-spacing: var(--ls-tight);
}
.stat-cmp-item .stat-cmp-cnt {
  font-size: var(--fs-meta);
  color: var(--hint);
}
.stat-cmp-bar {
  display: flex;
  height: 8px;
  border-radius: 6px;
  overflow: hidden;
  background: var(--line);
}
.stat-cmp-bar .bar-seg { height: 100%; }
.stat-cmp-bar .bar-p1   { background: #00e676; }
.stat-cmp-bar .bar-draw { background: #ffcc00; }
.stat-cmp-bar .bar-p2   { background: #ff3b30; }
.cmp-empty { text-align:center; padding:20px; color:var(--hint); font-size:var(--fs-label); }

.compare-btn {
  margin-top: 10px; width: 100%;
  padding: 9px 12px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--accent);
  color: var(--accent); font-weight: var(--fw-med); font-size: 13px;
  cursor: pointer; transition: .15s;
}
.compare-btn:active { transform: scale(.98); }

/* ===== Статистика прогнозов ===== */
.ls-total {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 12px;
}
.ls-total-row { display: flex; gap: 8px; margin-bottom: 10px; }
.ls-total-box {
  flex: 1; text-align: center;
  background: var(--bg2); border-radius: 10px; padding: 8px 4px;
}
.ls-total-box .num {
  font-size: var(--fs-num-sm);
  font-weight: var(--fw-black);
  letter-spacing: var(--ls-tight);
}
.ls-total-box .lbl {
  font-size: var(--fs-meta);
  color: var(--hint);
  margin-top: 3px;
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}
.ls-bars { display: flex; flex-direction: column; gap: 8px; }
.ls-bar .ls-bar-top {
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-meta);
  color: var(--hint);
  margin-bottom: 3px;
  letter-spacing: var(--ls-meta);
}
.ls-bar .ls-bar-val { font-weight: var(--fw-med); color: var(--text); }
.ls-bar .ls-bar-cnt { color: var(--hint); font-weight: var(--fw-reg); }
.ls-bar .ls-bar-track {
  height: 8px;
  background: var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.ls-bar .ls-bar-fill {
  height: 100%;
  border-radius: 6px;
  transition: width .3s;
}
.ls-bar-oc .ls-bar-fill { background: #00e676; }
.ls-bar-df .ls-bar-fill { background: #ffb300; }
.ls-bar-sc .ls-bar-fill { background: #1de9b6; }
.ls-acc { display: flex; flex-direction: column; gap: 6px; }
.ls-item {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.ls-item .ls-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; cursor: pointer;
}
.ls-item .ls-head-title {
  display: flex; align-items: center; gap: 8px;
  font-weight: var(--fw-med); font-size: 14px;
  min-width: 0;
}
.ls-item .ls-emoji { font-size: 18px; }
.ls-item .ls-name {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 60vw;
}
.ls-item .ls-head-right {
  display: flex; align-items: center; gap: 8px;
  color: var(--hint); font-size: var(--fs-meta);
}
.ls-item .ls-points { font-weight: var(--fw-bold); color: var(--accent); }
.ls-item .ls-chev {
  display: inline-block;
  transition: transform .2s;
  font-size: 12px;
}
.ls-item.open .ls-chev { transform: rotate(180deg); }
.ls-item .ls-body { display: none; padding: 0 12px 12px; }
.ls-item.open .ls-body { display: block; }
.ls-meta { display: flex; gap: 6px; margin-bottom: 10px; }
.ls-meta-box {
  flex: 1; text-align: center;
  background: var(--bg2); border-radius: 10px; padding: 8px 4px;
}
.ls-meta-box .num { font-size: var(--fs-num-sm); font-weight: var(--fw-bold); }
.ls-meta-box .lbl {
  font-size: var(--fs-meta);
  color: var(--hint);
  margin-top: 3px;
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}
.ls-pending {
  margin-top: 10px;
  font-size: var(--fs-meta);
  color: var(--hint);
  text-align: center;
}

/* ===== Уведомления ===== */
.notify-open-btn {
  display: block; width: 100%; margin: 0 0 12px;
  padding: 12px 14px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 12px; color: var(--text);
  font-size: 14px; font-weight: var(--fw-med);
  text-align: left; cursor: pointer;
}
.notify-open-btn:active { transform: scale(.99); }
.notify-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.notify-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 10px; cursor: pointer;
}
.notify-item input[type="checkbox"] {
  width: 20px; height: 20px;
  accent-color: var(--accent);
  flex-shrink: 0;
}
.notify-item .notify-emoji { font-size: 18px; }
.notify-item .notify-name { font-weight: var(--fw-med); font-size: 14px; }
.notify-save-btn {
  width: 100%; padding: 12px;
  background: var(--accent); color: #0f1115;
  border: none; border-radius: 10px;
  font-size: var(--fs-h3); font-weight: var(--fw-bold);
  cursor: pointer;
}
.notify-save-btn:active { transform: scale(.98); }
.notify-save-btn[disabled] { opacity: .6; }

/* ===== Модалка профиля ===== */
.user-modal .um-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.user-modal .um-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #0f1115;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: var(--fw-bold); flex-shrink: 0;
}
.user-modal .um-name {
  font-size: var(--fs-h2); font-weight: var(--fw-bold);
  margin: 0 0 2px; word-break: break-word;
}
.user-modal .um-sub { color: var(--hint); font-size: var(--fs-label); }
.um-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.um-box { background: var(--bg2); border-radius: 12px; padding: 12px; text-align: center; }
.um-box .num {
  font-size: var(--fs-num);
  font-weight: var(--fw-black);
  letter-spacing: var(--ls-tight);
  line-height: 1.1;
}
.um-box .lbl {
  font-size: var(--fs-meta);
  color: var(--hint);
  margin-top: 3px;
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}
.um-section {
  background: var(--bg2);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 10px;
}
.um-league-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.um-league-row:last-child { border-bottom: none; }
.um-league-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.um-league-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.um-league-right { display: flex; gap: 10px; font-size: var(--fs-meta); color: var(--hint); flex-shrink: 0; }
.um-league-right b { color: var(--text); font-weight: var(--fw-bold); }
.um-ach-list { display: flex; flex-wrap: wrap; gap: 6px; }
.um-ach-badge {
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 20px;
  font-size: 12px;
}
.um-empty { text-align: center; padding: 14px; color: var(--hint); font-size: var(--fs-label); }
.um-bars { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }

/* ===== Переключатель темы ===== */
.theme-icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg2);
  color: var(--text); font-size: 22px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: transform .15s, background .15s;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
}
.theme-icon-btn:active { transform: scale(.9); background: var(--accent2); }

/* ===== Список лиг ===== */
.leagues-list { display: flex; flex-direction: column; gap: 10px; padding: 0 12px 12px; }
.league-card {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 14px; cursor: pointer;
  transition: transform .15s, background .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
}
.league-card:active {
  transform: scale(.98); background: var(--accent2); border-color: var(--accent);
}
.league-card .lc-emoji {
  font-size: 28px; line-height: 1; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 24px;
}
.league-card .lc-body { flex: 1; min-width: 0; }
.league-card .lc-name {
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.league-card .lc-sub {
  font-size: var(--fs-meta);
  color: var(--hint);
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}
.league-card .lc-arrow { font-size: 18px; color: var(--hint); flex-shrink: 0; }

.matches-back { display: flex; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.matches-back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 20px; color: var(--text);
  font-size: 14px; font-weight: var(--fw-med);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.matches-back-btn:active { transform: scale(.97); background: var(--accent2); }
.matches-league-title {
  font-size: var(--fs-h3); font-weight: var(--fw-bold);
  margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0;
}

/* ===== Рейтинг за тур ===== */
.rating-toggle {
  display: flex;
  background: var(--bg2); border-radius: 12px;
  padding: 4px; margin: 0 12px 12px; gap: 4px;
}
.rating-toggle-btn {
  flex: 1; padding: 10px 8px; text-align: center;
  font-size: 14px; font-weight: var(--fw-med);
  border-radius: 9px; cursor: pointer;
  color: var(--hint);
  transition: .15s;
  -webkit-tap-highlight-color: transparent;
}
.rating-toggle-btn.active {
  background: var(--bg); color: var(--accent);
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.tour-selectors { display: flex; gap: 8px; padding: 0 12px 12px; }
.tour-select-wrap { flex: 1; position: relative; }
.tour-select-wrap select {
  width: 100%; padding: 12px 36px 12px 14px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 12px; color: var(--text);
  font-size: 14px; font-weight: var(--fw-med);
  appearance: none; -webkit-appearance: none;
  cursor: pointer; font-family: inherit;
}
.tour-select-wrap::after {
  content: "▾"; position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%); color: var(--hint);
  pointer-events: none; font-size: 12px;
}
.tour-info { padding: 0 12px 12px; display: flex; gap: 8px; }
.tour-info-box {
  flex: 1; background: var(--bg2); border-radius: 12px;
  padding: 10px; text-align: center;
}
.tour-info-box .num {
  font-size: var(--fs-h2);
  font-weight: var(--fw-bold);
  letter-spacing: var(--ls-tight);
  line-height: 1.1;
  color: var(--accent);
}
.tour-info-box .lbl {
  font-size: var(--fs-meta);
  color: var(--hint);
  margin-top: 3px;
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}
.tour-rating-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; background: var(--bg2);
  border-radius: 12px; margin-bottom: 8px; cursor: pointer;
}
.tour-rating-row.me { background: var(--accent2); border: 2px solid var(--accent); }
.tour-rating-row .tr-place {
  width: 36px; text-align: center;
  font-weight: var(--fw-bold);
  font-size: var(--fs-h3);
  color: var(--hint); flex-shrink: 0;
}
.tour-rating-row.top1 .tr-place { color: #ffd54f; font-size: var(--fs-num); }
.tour-rating-row.top2 .tr-place { color: #b0b0b5; font-size: var(--fs-num); }
.tour-rating-row.top3 .tr-place { color: #d4854a; font-size: var(--fs-num); }
.tour-rating-row .tr-body { flex: 1; min-width: 0; }
.tour-rating-row .tr-name {
  font-weight: var(--fw-med); font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tour-rating-row .tr-sub {
  font-size: var(--fs-meta);
  color: var(--hint);
  margin-top: 2px;
  letter-spacing: var(--ls-meta);
}
.tour-rating-row .tr-points {
  font-weight: var(--fw-bold);
  font-size: var(--fs-h3);
  color: var(--accent); flex-shrink: 0;
}
.tour-empty {
  text-align: center; padding: 40px 20px;
  color: var(--hint); font-size: var(--fs-label);
}

/* ===== Флаги ===== */
.flag-icon {
  display: inline-block;
  width: 20px; height: 14px;
  border-radius: 2px;
  vertical-align: middle;
  margin-right: 6px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.1);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.flag-eng { background: #fff; }
.flag-eng::before {
  content: ""; position: absolute;
  top: 0; left: 50%; width: 4px; height: 100%;
  background: #CE1124; transform: translateX(-50%);
}
.flag-eng::after {
  content: ""; position: absolute;
  top: 50%; left: 0; width: 100%; height: 4px;
  background: #CE1124; transform: translateY(-50%);
}
.flag-es {
  background: linear-gradient(to bottom,
    #AA151B 0%, #AA151B 25%,
    #F1BF00 25%, #F1BF00 75%,
    #AA151B 75%, #AA151B 100%);
}
.flag-it {
  background: linear-gradient(to right,
    #009246 0%, #009246 33.33%,
    #fff 33.33%, #fff 66.66%,
    #CE2B37 66.66%, #CE2B37 100%);
}
.flag-de {
  background: linear-gradient(to bottom,
    #000 0%, #000 33.33%,
    #DD0000 33.33%, #DD0000 66.66%,
    #FFCE00 66.66%, #FFCE00 100%);
}
.flag-fr {
  background: linear-gradient(to right,
    #002395 0%, #002395 33.33%,
    #fff 33.33%, #fff 66.66%,
    #ED2939 66.66%, #ED2939 100%);
}
.flag-br {
  background: linear-gradient(to right,
    #009246 0%, #009246 33.33%,
    #fff 33.33%, #fff 66.66%,
    #CE2B37 66.66%, #CE2B37 100%);
}
.flag-circle {
  width: 18px; height: 18px; border-radius: 50%;
  display: inline-block; vertical-align: middle; margin-right: 6px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.15);
  flex-shrink: 0; overflow: hidden; position: relative;
}

/* ===== Профиль ===== */
.pf-hero {
  display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
}
.pf-avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent); color: #0f1115;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: var(--fw-bold); flex-shrink: 0;
}
.pf-hero-info { flex: 1; min-width: 0; }
.pf-name {
  font-size: var(--fs-h2); font-weight: var(--fw-bold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pf-sub {
  font-size: var(--fs-label); color: var(--hint);
  margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pf-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.pf-stat {
  background: var(--bg2); border-radius: 12px;
  padding: 10px 6px; text-align: center;
}
.pf-stat-num {
  font-size: var(--fs-num);
  font-weight: var(--fw-black);
  line-height: 1.1;
  color: var(--accent);
  letter-spacing: var(--ls-tight);
}
.pf-stat-lbl {
  font-size: var(--fs-meta);
  color: var(--hint);
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
  margin-top: 3px;
}
.pf-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.pf-action {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 12px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 12px; color: var(--text);
  font-size: var(--fs-label); font-weight: var(--fw-med);
  cursor: pointer; text-align: left;
  transition: .15s; -webkit-tap-highlight-color: transparent;
}
.pf-action:active {
  transform: scale(.97);
  background: var(--accent2);
  border-color: var(--accent);
}
.pf-action-ico { font-size: 18px; line-height: 1; }
.pf-section {
  background: var(--bg2); border-radius: 14px;
  padding: 12px 12px 14px; margin-bottom: 10px;
}
.pf-empty { text-align: center; padding: 14px; color: var(--hint); font-size: var(--fs-label); }
.pf-leagues { display: flex; flex-direction: column; gap: 6px; }
.pf-lg-item {
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden;
  transition: border-color .15s;
}
.pf-lg-item.open { border-color: var(--accent); }
.pf-lg-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pf-lg-head:active { background: var(--accent2); }
.pf-lg-head-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.pf-lg-emoji { font-size: 16px; line-height: 1; }
.pf-lg-name {
  font-size: 14px; font-weight: var(--fw-med);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pf-lg-head-right {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0; font-size: var(--fs-meta); color: var(--hint);
}
.pf-lg-pts {
  font-size: 14px; font-weight: var(--fw-bold);
  color: var(--accent);
}
.pf-lg-cnt::before { content: "· "; color: var(--hint); }
.pf-lg-chev {
  display: inline-block; transition: transform .2s;
  font-size: 11px; color: var(--hint);
}
.pf-lg-item.open .pf-lg-chev { transform: rotate(180deg); }
.pf-lg-body { display: none; padding: 0 12px 12px; }
.pf-lg-item.open .pf-lg-body { display: block; }
.pf-lg-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.pf-lg-meta-box {
  background: var(--bg2); border-radius: 8px;
  padding: 6px 4px; text-align: center;
}
.pf-lg-meta-box .num { font-size: var(--fs-h3); font-weight: var(--fw-bold); }
.pf-lg-meta-box .lbl {
  font-size: var(--fs-meta);
  color: var(--hint);
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}
.pf-lg-pending {
  margin-top: 8px; font-size: var(--fs-meta);
  color: var(--hint); text-align: center;
}
.pf-section .ach-list { gap: 5px; }
.pf-section .ach-badge { font-size: var(--fs-meta); padding: 5px 9px; }

/* ===== XP-карточка (тёмная премиум) ===== */
.xp-card {
  background: linear-gradient(135deg, #1a1d24 0%, #23272f 100%);
  border: 1px solid rgba(0,230,118,.25);
  border-radius: 16px;
  padding: 16px;
  color: var(--text);
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 24px rgba(0,0,0,.4);
}
.xp-card::before {
  content: "";
  position: absolute;
  top: -40%; right: -20%;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(0,230,118,.18), transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.xp-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
  position: relative; z-index: 1;
}
.xp-level-badge {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(0,230,118,.12);
  border: 2px solid rgba(0,230,118,.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
  position: relative;
  box-shadow: inset 0 0 16px rgba(0,230,118,.15);
}
.xp-level-badge .xp-lvl-num {
  position: absolute; bottom: -8px; left: 50%;
  transform: translateX(-50%);
  background: #00e676; color: #0f1115;
  font-size: 9px; font-weight: var(--fw-black);
  padding: 2px 6px;
  border-radius: 6px;
  white-space: nowrap;
  letter-spacing: var(--ls-meta);
  box-shadow: 0 2px 8px rgba(0,230,118,.4);
}
.xp-info { flex: 1; min-width: 0; }
.xp-title {
  font-size: var(--fs-h2);
  font-weight: var(--fw-black);
  margin-bottom: 3px;
  letter-spacing: var(--ls-tight);
  color: var(--text);
}
.xp-sub {
  font-size: var(--fs-meta);
  color: var(--hint);
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap;
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}
.xp-streak {
  background: rgba(0,230,118,.15);
  color: #00e676;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: var(--fw-med);
}
.xp-total { text-align: right; flex-shrink: 0; }
.xp-total-num {
  font-size: var(--fs-h3); font-weight: var(--fw-black);
  line-height: 1.1;
  letter-spacing: var(--ls-tight);
  color: #00e676;
}
.xp-total-lbl {
  font-size: 10px;
  color: var(--hint);
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}
.xp-bar-track {
  height: 12px;
  background: rgba(255,255,255,.06);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 6px;
  position: relative; z-index: 1;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
}
.xp-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #00e676 0%, #1de9b6 100%);
  border-radius: 8px;
  transition: width .6s cubic-bezier(.4,0,.2,1);
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 6px;
  position: relative;
  box-shadow: 0 0 12px rgba(0,230,118,.5);
  min-width: 24px;
}
.xp-bar-pct {
  font-size: 9px;
  font-weight: var(--fw-black);
  color: #0f1115;
  letter-spacing: var(--ls-meta);
}
.xp-bar-label {
  display: flex; justify-content: space-between;
  font-size: var(--fs-meta);
  color: var(--hint);
  margin-bottom: 12px;
  position: relative; z-index: 1;
  gap: 8px;
  letter-spacing: var(--ls-meta);
}
.xp-bar-label span { white-space: nowrap; }
.xp-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  position: relative; z-index: 1;
}
.xp-stat-box {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 10px;
  padding: 8px 4px;
  text-align: center;
}
.xp-stat-box .num {
  font-size: var(--fs-num-sm);
  font-weight: var(--fw-black);
  line-height: 1.1;
  letter-spacing: var(--ls-tight);
  color: #00e676;
}
.xp-stat-box .lbl {
  font-size: 10px;
  color: var(--hint);
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
}

/* ===== Задания ===== */
.tasks-section { margin-bottom: 16px; }
.tasks-section-title {
  font-size: var(--fs-meta);
  font-weight: var(--fw-bold);
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
  color: var(--hint);
  margin: 0 4px 8px;
}
.task-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 8px;
  transition: .2s;
  position: relative;
  overflow: hidden;
}
.task-card.done { border-color: var(--win); background: rgba(0,230,118,.08); }
.task-card.claimed { opacity: .6; }
.task-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.task-card.done .task-icon {
  background: var(--win);
  border-color: var(--win);
}
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 14px; font-weight: var(--fw-bold); margin-bottom: 3px; }
.task-desc { font-size: var(--fs-meta); color: var(--hint); margin-bottom: 6px; }
.task-progress {
  height: 6px;
  background: var(--line);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 4px;
}
.task-progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  transition: width .4s;
}
.task-card.done .task-progress-fill { background: var(--win); }
.task-progress-text {
  font-size: 10px; color: var(--hint);
  display: flex; justify-content: space-between;
  letter-spacing: var(--ls-meta);
}
.task-reward {
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  flex-shrink: 0;
}
.task-xp { font-size: 13px; font-weight: var(--fw-black); color: var(--accent); }
.task-card.done .task-xp { color: var(--win); }

/* ============================================================
   КНОПКА «ЗАБРАТЬ» — ПУЛЬСАЦИЯ СО СВЕЧЕНИЕМ
   ============================================================ */
.task-claim-btn {
  padding: 6px 10px;
  background: var(--win);
  color: #0f1115;
  border: none;
  border-radius: 8px;
  font-size: var(--fs-meta);
  font-weight: var(--fw-bold);
  text-transform: uppercase;
  letter-spacing: var(--ls-meta);
  cursor: pointer;
  position: relative;
  box-shadow: 0 0 0 0 rgba(0,230,118,.55);
  animation: pulseClaimDark 1.6s cubic-bezier(.4,0,.6,1) infinite;
  will-change: box-shadow, transform;
}
.task-claim-btn:active {
  transform: scale(.94);
  animation-play-state: paused;
}
@keyframes pulseClaimDark {
  0% {
    box-shadow:
      0 0 0 0    rgba(0,230,118,.7),
      0 0 0 0    rgba(0,230,118,.4),
      0 0 14px 3px rgba(0,230,118,.5);
    transform: scale(1);
  }
  45% {
    box-shadow:
      0 0 0 6px  rgba(0,230,118,0),
      0 0 0 14px rgba(0,230,118,0),
      0 0 24px 6px rgba(0,230,118,.85);
    transform: scale(1.03);
  }
  70% {
    box-shadow:
      0 0 0 0    rgba(0,230,118,0),
      0 0 0 0    rgba(0,230,118,0),
      0 0 14px 4px rgba(0,230,118,.6);
    transform: scale(1);
  }
  100% {
    box-shadow:
      0 0 0 0    rgba(0,230,118,.7),
      0 0 0 0    rgba(0,230,118,.4),
      0 0 14px 3px rgba(0,230,118,.5);
    transform: scale(1);
  }
}
/* Светлая версия — мягче свечение */
body.light .task-claim-btn {
  animation-name: pulseClaim;
}
@keyframes pulseClaim {
  0% {
    box-shadow:
      0 0 0 0    rgba(0,168,68,.55),
      0 0 0 0    rgba(0,168,68,.35),
      0 0 8px 2px rgba(0,168,68,.35);
    transform: scale(1);
  }
  45% {
    box-shadow:
      0 0 0 6px  rgba(0,168,68,0),
      0 0 0 14px rgba(0,168,68,0),
      0 0 18px 4px rgba(0,168,68,.6);
    transform: scale(1.03);
  }
  70% {
    box-shadow:
      0 0 0 0    rgba(0,168,68,0),
      0 0 0 0    rgba(0,168,68,0),
      0 0 10px 3px rgba(0,168,68,.4);
    transform: scale(1);
  }
  100% {
    box-shadow:
      0 0 0 0    rgba(0,168,68,.55),
      0 0 0 0    rgba(0,168,68,.35),
      0 0 8px 2px rgba(0,168,68,.35);
    transform: scale(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .task-claim-btn {
    animation: none;
    box-shadow: 0 0 0 4px rgba(0,230,118,.25);
  }
}

.task-claimed-mark {
  font-size: var(--fs-meta);
  color: var(--win);
  font-weight: var(--fw-bold);
  letter-spacing: var(--ls-meta);
}

/* XP-тост */
.xp-toast {
  position: fixed;
  top: 80px; left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: linear-gradient(135deg, #00e676 0%, #1de9b6 100%);
  color: #0f1115;
  padding: 12px 22px;
  border-radius: 14px;
  font-size: var(--fs-h3);
  font-weight: var(--fw-black);
  z-index: 150;
  opacity: 0;
  pointer-events: none;
  transition: all .3s;
  box-shadow: 0 8px 24px rgba(0,230,118,.4);
}
.xp-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Модалка level up */
.levelup-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.8);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.levelup-backdrop.show { opacity: 1; pointer-events: auto; }
.levelup-modal {
  background: linear-gradient(135deg, #00c853 0%, #00e676 100%);
  color: #0f1115;
  border-radius: 24px;
  padding: 32px 28px;
  text-align: center;
  max-width: 320px;
  transform: scale(.7);
  transition: transform .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 20px 60px rgba(0,230,118,.4);
}
.levelup-backdrop.show .levelup-modal { transform: scale(1); }
.levelup-icon {
  font-size: 72px;
  margin-bottom: 10px;
  animation: bounceIcon .6s infinite alternate;
}
@keyframes bounceIcon {
  to { transform: translateY(-10px) scale(1.05); }
}
.levelup-title { font-size: 24px; font-weight: var(--fw-black); margin-bottom: 6px; color: #0f1115; }
.levelup-sub { font-size: 14px; opacity: .8; margin-bottom: 20px; color: #0f1115; }
.levelup-btn {
  padding: 12px 28px;
  background: #0f1115;
  color: #00e676;
  border: none;
  border-radius: 12px;
  font-size: var(--fs-h3);
  font-weight: var(--fw-black);
  cursor: pointer;
}

/* ============================================================ */
/* ПРИВАТНЫЕ ЛИГИ                                                */
/* ============================================================ */
.priv-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}
.priv-btn-create,
.priv-btn-join {
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--line);
  transition: .15s;
  -webkit-tap-highlight-color: transparent;
}
.priv-btn-create {
  background: var(--accent);
  color: #0f1115;
  border-color: var(--accent);
}
.priv-btn-join {
  background: var(--bg2);
  color: var(--text);
}
.priv-btn-create:active,
.priv-btn-join:active { transform: scale(.97); }

.priv-leagues-list { display: flex; flex-direction: column; gap: 8px; }
.priv-league-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
  transition: .15s;
  -webkit-tap-highlight-color: transparent;
}
.priv-league-card:active {
  transform: scale(.98);
  background: var(--accent2);
  border-color: var(--accent);
}
.plc-emoji { font-size: 28px; line-height: 1; flex-shrink: 0; }
.plc-body { flex: 1; min-width: 0; }
.plc-name {
  font-weight: 600; font-size: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.plc-meta {
  font-size: 11px; color: var(--hint);
  margin-top: 3px; text-transform: uppercase;
  letter-spacing: .5px;
}
.plc-arrow {
  font-weight: 700; font-size: 18px;
  color: var(--hint); flex-shrink: 0;
}

/* Прогноз в лиге */
.league-match-pred {
  margin-top: 8px;
  border-top: 1px dashed var(--line);
  padding-top: 10px;
}
.league-odds-row {
  display: flex;
  gap: 4px;
  margin-bottom: 6px;
}
.league-odds-btn {
  flex: 1;
  padding: 6px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
}
.league-odds-btn.selected {
  background: var(--accent);
  color: #0f1115;
  border-color: var(--accent);
}
.league-score-row {
  display: none;
  gap: 6px;
  align-items: center;
}
.league-score-row.visible { display: flex; }
.league-score-row input {
  width: 36px;
  padding: 6px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--text);
  border-radius: 6px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
}
.league-score-row button {
  flex: 1;
  padding: 6px;
  background: var(--accent);
  color: #0f1115;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

/* Выбор матчей */
.league-match-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 6px;
}
.league-match-item .info {
  flex: 1;
  min-width: 0;
}
.league-match-item .name {
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.league-match-item .time {
  font-size: 11px;
  color: var(--hint);
  margin-top: 2px;
}
.league-match-item input[type="checkbox"] {
  width: 22px;
  height: 22px;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
}

/* Детали лиги */
.pl-detail-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.pl-back-btn {
  padding: 8px 14px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 20px;
  color: var(--text);
  font-size: 14px; font-weight: 500;
  cursor: pointer;
}
.pl-back-btn:active { background: var(--accent2); }
.pl-title {
  font-size: 16px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0;
}

.pl-invite-box {
  background: var(--bg2);
  border: 1px solid var(--accent);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
  text-align: center;
}
.pl-invite-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: .8px; color: var(--hint);
  margin-bottom: 6px;
}
.pl-invite-code {
  font-size: 28px; font-weight: 800;
  letter-spacing: 4px;
  color: var(--accent);
  font-family: ui-monospace, monospace;
  margin-bottom: 12px;
}
.pl-copy-btn,
.pl-share-btn {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--text);
  margin-bottom: 6px;
}
.pl-share-btn {
  background: var(--accent);
  color: #0f1115;
  border-color: var(--accent);
  margin-bottom: 0;
}
.pl-copy-btn:active,
.pl-share-btn:active { transform: scale(.97); }

.pl-rating { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.pl-rating-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  background: var(--bg2);
  border-radius: 12px;
  border: 2px solid transparent;
}
.pl-rating-row.me {
  background: var(--accent2);
  border-color: var(--accent);
}
.plr-place {
  width: 32px; text-align: center;
  font-weight: 800; font-size: 14px;
  color: var(--hint); flex-shrink: 0;
}
.pl-rating-row:nth-child(1) .plr-place { color: #ffd54f; font-size: 20px; }
.pl-rating-row:nth-child(2) .plr-place { color: #b0b0b5; font-size: 20px; }
.pl-rating-row:nth-child(3) .plr-place { color: #d4854a; font-size: 20px; }
.plr-body { flex: 1; min-width: 0; }
.plr-name {
  font-weight: 600; font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.plr-sub {
  font-size: 11px; color: var(--hint);
  margin-top: 2px; letter-spacing: .5px;
}
.plr-points {
  font-weight: 700; font-size: 15px;
  color: var(--accent); flex-shrink: 0;
}

.pl-actions { display: flex; flex-direction: column; gap: 8px; }
.pl-actions button {
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--text);
}
.pl-actions .btn-danger {
  background: rgba(255, 59, 48, .15);
  color: var(--lose);
  border-color: var(--lose);
}
.pl-actions button:active { transform: scale(.98); }

/* Emoji-пикер */
.emoji-row {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.emoji-pick {
  width: 44px; height: 44px;
  border-radius: 10px;
  border: 2px solid var(--line);
  background: var(--bg2);
  font-size: 22px;
  cursor: pointer;
  transition: .12s;
}
.emoji-pick.selected {
  border-color: var(--accent);
  background: var(--accent2);
}

/* ============================================================
   МАГАЗИН + 3D-FLIP КАРТОЧКИ
   ============================================================ */

.shop-banner {
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(135deg, #1a3a2e, #0d1f18);
  border: 1px solid var(--accent);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 16px;
  cursor: pointer; transition: transform .15s;
}
.shop-banner:active { transform: scale(.98); }
.shop-banner-title { font-size: 15px; font-weight: 700; }
.shop-banner-sub { font-size: 12px; color: var(--hint); margin-top: 2px; }
.shop-banner-arrow { font-size: 26px; color: var(--accent); }

.shop-section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--hint); font-weight: 700; margin: 0 4px 8px;
}

.shop-box {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px; margin-bottom: 10px;
}
.shop-box.locked { opacity: .55; }
.shop-box-emoji { font-size: 40px; flex-shrink: 0; line-height: 1; }
.shop-box-body { flex: 1; min-width: 0; }
.shop-box-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.shop-box-meta { font-size: 11px; color: var(--hint); margin-bottom: 4px; }
.shop-box-price { font-size: 14px; font-weight: 800; color: var(--accent); }
.shop-box-btn {
  padding: 10px 16px; border-radius: 10px;
  background: var(--accent); color: #0f1115;
  border: none; font-size: 13px; font-weight: 700;
  cursor: pointer; flex-shrink: 0;
}
.shop-box-btn:disabled { opacity: .5; cursor: not-allowed; }
.shop-box-btn:active:not(:disabled) { transform: scale(.95); }

/* ====== Модалка открытия ====== */
.box-modal {
  display: flex; flex-direction: column; align-items: center;
  padding: 30px 16px 20px;
  background: linear-gradient(180deg, #0f1115 0%, #1a1d24 100%);
  border-top: 2px solid var(--accent);
  max-width: 100% !important;
}

.box-stage {
  position: relative; width: 140px; height: 140px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
}
.box-sprite {
  font-size: 96px; line-height: 1;
  filter: drop-shadow(0 0 20px rgba(0,230,118,.5));
}
.box-sprite.shake { animation: boxShake .6s infinite; }
.box-sprite.pop { animation: boxPop .4s forwards; }
.box-shine { position: absolute; inset: 0; border-radius: 50%; opacity: 0; pointer-events: none; }
.box-shine.flash { animation: boxFlash .5s; }

@keyframes boxShake {
  0%,100% { transform: rotate(0) translate(0,0); }
  20% { transform: rotate(-6deg) translate(-3px,2px); }
  40% { transform: rotate(6deg) translate(3px,-2px); }
  60% { transform: rotate(-4deg) translate(-2px,1px); }
  80% { transform: rotate(4deg) translate(2px,-1px); }
}
@keyframes boxPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); }
  100% { transform: scale(0); opacity: 0; }
}
@keyframes boxFlash {
  0% { opacity: 0; box-shadow: 0 0 0 0 rgba(0,230,118,0); }
  40% { opacity: 1; box-shadow: 0 0 100px 40px rgba(0,230,118,.9); }
  100% { opacity: 0; box-shadow: 0 0 200px 80px rgba(0,230,118,0); }
}

/* ============================================================
   3D-FLIP КАРТОЧКИ
   ============================================================ */
.box-cards {
  display: flex; gap: 10px; justify-content: center;
  width: 100%; flex-wrap: wrap; margin-bottom: 20px;
  perspective: 1200px;
}

.card-slot {
  width: 100px;
  height: 155px;
  opacity: 0;
  transform: translateY(30px) scale(.85);
  transition: opacity .4s, transform .5s cubic-bezier(.34,1.4,.64,1);
}
.card-slot.revealed {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.card-flip-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .8s cubic-bezier(.4,0,.2,1);
}
.card-slot.flipped .card-flip-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 12px;
  overflow: hidden;
}

/* Рубашка (задняя сторона) */
.card-back {
  background: linear-gradient(135deg, #1a1d24, #23272f);
  border: 2px solid #2a2e36;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  color: #00e676;
}
.card-back-pattern {
  font-size: 42px;
  filter: drop-shadow(0 0 12px rgba(0,230,118,.6));
  animation: backPulse 1.5s ease-in-out infinite;
}
.card-back-label {
  font-size: 9px;
  letter-spacing: 3px;
  margin-top: 8px;
  color: #00e67699;
  text-transform: uppercase;
}
@keyframes backPulse {
  50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(0,230,118,.9)); }
}

/* Лицо (сам игрок) */
.card-front {
  transform: rotateY(180deg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 8px 6px;
  color: #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,.5);
}

/* Редкости — цвет и свечение */
.card-front[data-rarity="common"] { background: linear-gradient(135deg,#3a3d44,#23262d); border: 2px solid #9aa0a6; }
.card-front[data-rarity="rare"] { background: linear-gradient(135deg,#1a3a6b,#0d1d3a); border: 2px solid #4a90e2; }
.card-front[data-rarity="epic"] { background: linear-gradient(135deg,#4a1e7a,#1f0a33); border: 2px solid #a855f7; box-shadow: 0 0 20px rgba(168,85,247,.5); }
.card-front[data-rarity="legendary"] { background: linear-gradient(135deg,#7a4a00,#3d2500); border: 2px solid #f59e0b; box-shadow: 0 0 28px rgba(245,158,11,.7); animation: legendaryPulse 2s infinite; }
.card-front[data-rarity="mythic"] { background: linear-gradient(135deg,#7a0077,#3d003d); border: 2px solid #ff6ec7; box-shadow: 0 0 30px rgba(255,110,199,.8); animation: mythicGlow 2.5s infinite; }

@keyframes legendaryPulse {
  50% { box-shadow: 0 0 38px rgba(245,158,11,.95); }
}
@keyframes mythicGlow {
  0%   { box-shadow: 0 0 30px rgba(255,110,199,.8); }
  33%  { box-shadow: 0 0 35px rgba(0,230,118,.8); }
  66%  { box-shadow: 0 0 35px rgba(74,144,226,.8); }
  100% { box-shadow: 0 0 30px rgba(255,110,199,.8); }
}

.card-rarity {
  position: absolute; top: 6px; left: 0; right: 0;
  text-align: center; font-size: 8px; font-weight: 800;
  letter-spacing: 1.2px; text-transform: uppercase;
}
.card-front[data-rarity="common"] .card-rarity    { color: #9aa0a6; }
.card-front[data-rarity="rare"] .card-rarity      { color: #4a90e2; }
.card-front[data-rarity="epic"] .card-rarity      { color: #c084fc; }
.card-front[data-rarity="legendary"] .card-rarity { color: #fbbf24; }
.card-front[data-rarity="mythic"] .card-rarity    { color: #ff6ec7; }

.card-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid; background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  position: relative; margin: 14px 0 6px;
}
.card-initials { font-size: 14px; font-weight: 800; }
.card-flag { position: absolute; bottom: -4px; right: -4px; font-size: 14px; }
.card-ovr { font-size: 22px; font-weight: 900; line-height: 1; }
.card-pos { font-size: 9px; font-weight: 700; opacity: .85; letter-spacing: .5px; margin-top: 1px; }
.card-name { font-size: 10px; font-weight: 700; margin-top: 4px; text-align: center; line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-club { font-size: 8px; opacity: .65; margin-top: 1px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* Shine sweep после флипа (только для epic+) */
.card-slot.epic-plus.flipped .card-front::before,
.card-slot.epic-plus.flipped .card-front::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  width: 30px;
  background: linear-gradient(105deg, transparent, rgba(255,255,255,.6), transparent);
  transform: skewX(-20deg);
  animation: cardShine 1.2s ease-out 0.9s;
  pointer-events: none;
}
@keyframes cardShine {
  0% { left: -50px; opacity: 0; }
  30% { opacity: 1; }
  100% { left: 110%; opacity: 0; }
}

.box-footer { width: 100%; text-align: center; }
.box-new-balance { font-size: 12px; color: var(--hint); margin-bottom: 10px; }
.box-collect-btn {
  width: 100%; padding: 14px;
  background: var(--accent); color: #0f1115;
  border: none; border-radius: 12px;
  font-size: 15px; font-weight: 800;
  cursor: pointer;
}
.box-collect-btn:active { transform: scale(.97); }

/* ====== Коллекция ====== */
.coll-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.coll-back {
  padding: 8px 14px; background: var(--bg2);
  border: 1px solid var(--line); border-radius: 20px;
  color: var(--text); font-size: 13px; font-weight: 600;
  cursor: pointer;
}
.coll-title { font-size: 17px; font-weight: 800; }
.coll-stats { display: flex; gap: 8px; margin-bottom: 16px; }
.coll-stat { flex: 1; text-align: center; background: var(--bg2); border-radius: 12px; padding: 10px 4px; }
.coll-stat .num { font-size: 20px; font-weight: 800; color: var(--accent); }
.coll-stat .lbl { font-size: 10px; color: var(--hint); margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }

.coll-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.card-mini {
  background: var(--bg2); border: 2px solid;
  border-radius: 12px; padding: 10px 8px;
  text-align: center; position: relative;
  overflow: hidden;
}
.cm-ovr { position: absolute; top: 6px; right: 8px; font-size: 14px; font-weight: 900; }
.cm-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 4px auto 6px; position: relative;
  font-size: 14px; font-weight: 800; color: #fff;
}
.cm-flag { position: absolute; bottom: -4px; right: -4px; font-size: 13px; }
.cm-name { font-size: 12px; font-weight: 700; line-height: 1.15; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-meta { font-size: 9px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-qty {
  position: absolute; bottom: 6px; right: 8px;
  background: var(--accent); color: #0f1115;
  font-size: 10px; font-weight: 800;
  padding: 2px 6px; border-radius: 8px;
}

/* ===== GIF Highlights ===== */
.gif-btn {
  margin-top: 8px;
  width: 100%;
  padding: 9px 12px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.gif-btn:active { transform: scale(.98); }

.gif-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.gif-item {
  width: 100%;
  max-height: 240px;
  border-radius: 12px;
  background: #000;
  object-fit: cover;
  display: block;
}
.gif-credit {
  text-align: center;
  font-size: 10px;
  color: var(--hint);
  margin-top: 8px;
  letter-spacing: .5px;
  text-transform: uppercase;
}

/* ===== Joker ===== */
.joker-box { border-color: #a855f7 !important; }
.joker-box .shop-box-emoji { filter: drop-shadow(0 0 12px #a855f7); }

.joker-toggle-row {
  margin-bottom: 8px;
}
.joker-toggle-btn {
  width: 100%;
  padding: 8px;
  background: var(--bg);
  border: 1px dashed #a855f7;
  border-radius: 8px;
  color: #a855f7;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: .15s;
}
.joker-toggle-btn.active {
  background: #a855f7;
  color: #fff;
  border-style: solid;
}

/* ============================================================
   BATTLE ARENA — футбольное поле с анимацией
   ============================================================ */

.battle-arena {
  padding: 8px 0 4px;
}

/* Табло */
.battle-scoreboard {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  font-family: 'Courier New', monospace;
}
.battle-scoreboard .bs-num {
  font-size: 28px;
  font-weight: 900;
  color: var(--accent);
  min-width: 30px;
  text-align: center;
  transition: transform .3s;
}
.battle-scoreboard .bs-num.pop {
  transform: scale(1.5);
  color: #fff;
  text-shadow: 0 0 20px var(--accent);
}
.battle-scoreboard .bs-sep {
  font-size: 22px;
  color: var(--hint);
  font-weight: 700;
}
.battle-scoreboard .bs-label {
  font-size: 10px;
  color: var(--hint);
  text-transform: uppercase;
  letter-spacing: .5px;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
}

/* Поле */
.battle-pitch {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  background: linear-gradient(180deg, #1a4d2e 0%, #0d3d1f 50%, #1a4d2e 100%);
  border: 2px solid #2a6d3e;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
  box-shadow: inset 0 0 40px rgba(0,0,0,.5);
}
/* Полосы газона */
.battle-pitch::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    90deg,
    transparent 0%,
    transparent 10%,
    rgba(255,255,255,.03) 10%,
    rgba(255,255,255,.03) 20%
  );
  pointer-events: none;
}
/* Центральная линия */
.pitch-center-line {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: rgba(255,255,255,.4);
  transform: translateX(-50%);
}
/* Центральный круг */
.pitch-center-circle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 22%;
  aspect-ratio: 1;
  border: 2px solid rgba(255,255,255,.4);
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
/* Ворота */
.pitch-goal {
  position: absolute;
  top: 50%;
  width: 8%;
  height: 30%;
  transform: translateY(-50%);
  border: 2px solid rgba(255,255,255,.6);
  background: rgba(0,0,0,.3);
}
.pitch-goal.left  { left: 0;  border-left: none;  border-radius: 0 4px 4px 0; }
.pitch-goal.right { right: 0; border-right: none; border-radius: 4px 0 0 4px; }

/* Штрафные */
.pitch-box {
  position: absolute;
  top: 50%;
  height: 55%;
  width: 18%;
  transform: translateY(-50%);
  border: 2px solid rgba(255,255,255,.4);
}
.pitch-box.left  { left: 0;  border-left: none; }
.pitch-box.right { right: 0; border-right: none; }

/* Мяч */
.pitch-ball {
  position: absolute;
  width: 24px;
  height: 24px;
  font-size: 22px;
  line-height: 24px;
  text-align: center;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  transition: left .4s cubic-bezier(.4,0,.2,1),
              top .4s cubic-bezier(.4,0,.2,1),
              transform .4s;
  z-index: 5;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
}
.pitch-ball.kick {
  animation: ballSpin .4s linear;
}
@keyframes ballSpin {
  from { transform: translate(-50%, -50%) rotate(0); }
  to   { transform: translate(-50%, -50%) rotate(720deg); }
}

/* Вспышка при голе */
.pitch-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(0,230,118,.8) 0%, transparent 70%);
  opacity: 0;
  pointer-events: none;
  z-index: 4;
}
.pitch-flash.goal {
  animation: goalFlash .6s;
}
@keyframes goalFlash {
  0%   { opacity: 0; }
  30%  { opacity: 1; }
  100% { opacity: 0; }
}
.pitch-flash.miss {
  background: radial-gradient(circle, rgba(255,59,48,.6) 0%, transparent 70%);
  animation: goalFlash .4s;
}

/* Текст ГОЛ / МИМО */
.pitch-goal-text {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 42px;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent), 0 4px 8px rgba(0,0,0,.8);
  z-index: 10;
  opacity: 0;
  pointer-events: none;
  letter-spacing: 2px;
  text-align: center;
  line-height: 1;
}
.pitch-goal-text.show {
  animation: goalTextPop .9s cubic-bezier(.34,1.56,.64,1);
}
.pitch-goal-text.miss {
  color: #ffb300;
  text-shadow: 0 0 20px #ffb300, 0 4px 8px rgba(0,0,0,.8);
  font-size: 36px;
}
@keyframes goalTextPop {
  0%   { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
  40%  { transform: translate(-50%, -50%) scale(1.3) rotate(3deg); opacity: 1; }
  70%  { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
  100% { transform: translate(-50%, -80%) scale(.9); opacity: 0; }
}

/* Команды — карточки под полем */
.battle-teams-row {
  display: flex;
  align-items: stretch;
  gap: 8px;
  margin-bottom: 12px;
}
.bt-team {
  flex: 1;
  background: var(--bg2);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  position: relative;
  min-width: 0;
}
.bt-team.me   { border-color: var(--accent); }
.bt-team.opp  { border-color: #ff3b30; }
.bt-team-label {
  font-size: 9px;
  color: var(--hint);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 3px;
}
.bt-team-name {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.bt-team-power {
  font-size: 18px;
  font-weight: 900;
  color: var(--accent);
}
.bt-team.opp .bt-team-power { color: #ff3b30; }
.bt-vs {
  display: flex;
