  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  color: var(--hint);
  flex-shrink: 0;
  width: 30px;
}

/* Мини-иконки игроков на поле */
.pitch-team-icons {
  position: absolute;
  display: flex;
  gap: 4px;
  z-index: 3;
}
.pitch-team-icons.me {
  left: 6%;
  bottom: 12%;
}
.pitch-team-icons.opp {
  right: 6%;
  top: 12%;
}
.pitch-team-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
}
.pitch-team-dot.opp {
  background: #ff3b30;
  box-shadow: 0 0 6px #ff3b30;
}

/* Ход матча */
.battle-timeline {
  background: var(--bg2);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--hint);
  text-align: center;
  min-height: 36px;
  transition: .3s;
}
.battle-timeline .tl-minute {
  color: var(--accent);
  font-weight: 800;
  margin-right: 6px;
}
.battle-timeline.goal {
  background: rgba(0,230,118,.15);
  color: var(--win);
  font-weight: 700;
}
.battle-timeline.miss {
  background: rgba(255,179,0,.1);
  color: #ffb300;
}

/* Итог */
.battle-final {
  text-align: center;
  padding: 16px;
  border-radius: 14px;
  margin-top: 12px;
}
.battle-final.win  { background: rgba(0,230,118,.15); border: 2px solid var(--win); }
.battle-final.lose { background: rgba(255,59,48,.15); border: 2px solid var(--lose); }
.battle-final.draw { background: rgba(255,204,0,.15); border: 2px solid #ffcc00; }
.battle-final-title {
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 8px;
}
.battle-final-xp {
  font-size: 16px;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 10px;
}

/* Конфетти при победе */
.confetti-piece {
  position: fixed;
  width: 8px;
  height: 14px;
  z-index: 999;
  top: -20px;
  pointer-events: none;
  border-radius: 2px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* Кнопка пропуска анимации */
.battle-skip-btn {
  display: block;
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
  background: transparent;
  border: 1px dashed var(--line);
  border-radius: 10px;
  color: var(--hint);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.battle-skip-btn:active { transform: scale(.98); }

/* Мобильная адаптация */
@media (max-width: 380px) {
  .pitch-goal-text { font-size: 34px; }
  .pitch-goal-text.miss { font-size: 28px; }
  .battle-scoreboard .bs-num { font-size: 22px; }
}

<script>
/* ============================================================
   ХЕЛПЕРЫ ФЛАГОВ
   ============================================================ */
function leagueFlagHtml(league) {
  if (!league) return "";
  if (league.flagClass) {
    return '<span class="flag-icon ' + league.flagClass + '"></span>';
  }
  return league.emoji ? escapeHtml(league.emoji) + ' ' : '';
}

function leagueFlagHtmlSmall(league) {
  if (!league) return "";
  if (league.flagClass) {
    return '<span class="flag-icon ' + league.flagClass + '" style="margin-right:4px"></span>';
  }
  return league.emoji ? escapeHtml(league.emoji) : '';
}

/* ============================================================
   ИКОНКИ КОМАНД (кресты)
   ============================================================ */
function teamCrestHtml(team) {
  if (!team) return "";
  var letter = String(team.shortName || team.name || "?").trim().charAt(0).toUpperCase() || "?";
  // 🔧 FIX: фильтр алфавита — если буква спецсимвол (', ", \, &), заменяем на '?'
  // (иначе ломается JS-строка внутри onerror)
  if (!/[A-ZА-ЯЁ0-9]/i.test(letter)) letter = "?";
  if (team.crestUrl) {
    return '<img class="team-crest" src="' + escapeHtml(team.crestUrl) + '" ' +
           'alt="" loading="lazy" ' +
           'onerror="this.outerHTML=\'<span class=&quot;team-crest-fallback&quot;>' +
           letter + '</span>\'">';
  }
  return '<span class="team-crest-fallback">' + letter + '</span>';
}

function matchTeamsHtml(match) {
  if (!match) return "";

  var h = match.homeTeam;
  var a = match.awayTeam;

  if (!h || !a) {
    var parts = String(match.matchName || "").split(/\s*[-–—]\s*/);
    h = { name: (parts[0] || "").trim() };
    a = { name: (parts[1] || "").trim() };
  }

  var hName = h.shortName || h.name || "";
  var aName = a.shortName || a.name || "";

  return '' +
    '<div class="match-teams-row">' +
      '<span class="team">' + teamCrestHtml(h) + escapeHtml(hName) + '</span>' +
      '<span class="vs">—</span>' +
      '<span class="team">' + teamCrestHtml(a) + escapeHtml(aName) + '</span>' +
    '</div>';
}

/* ============================================================
   ТЕМА: dark (по умолчанию) / light
   ============================================================ */
var THEME_KEY = 'app_theme';

function getStoredTheme() {
  try {
    var t = localStorage.getItem(THEME_KEY);
    return (t === 'light') ? 'light' : 'dark';
  } catch (e) { return 'dark'; }
}

function applyTheme(mode) {
  var isLight = (mode === 'light');
  document.body.classList.toggle('light', isLight);

  var tgApp = window.Telegram ? window.Telegram.WebApp : null;
  if (tgApp) {
    try {
      if (tgApp.setHeaderColor)     tgApp.setHeaderColor(isLight ? '#ffffff' : '#0f1115');
      if (tgApp.setBackgroundColor) tgApp.setBackgroundColor(isLight ? '#ffffff' : '#0f1115');
    } catch (e) {}
  }
}

function updateThemeIcon() {
  var el = document.getElementById('themeToggleBtn');
  if (!el) return;
  var isLight = document.body.classList.contains('light');
  el.textContent = isLight ? '☀️' : '🌙';
  el.title = isLight ? 'Светлая тема' : 'Тёмная тема';
}

function toggleTheme() {
  var isLightNow = document.body.classList.contains('light');
  var next = isLightNow ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
  updateThemeIcon();
}

applyTheme(getStoredTheme());

/* ============================================================
   TELEGRAM
   ============================================================ */
var tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  try {
    tg.ready();
    tg.expand();
  } catch (e) { console.error(e); }
}

// 🔧 FIX: haptic не была определена — ломала все клики
function haptic(type) {
  if (!tg || !tg.HapticFeedback) return;
  try { tg.HapticFeedback.impactOccurred(type || 'light'); } catch (e) {}
}

var paramChatId   = <?!= JSON.stringify(chatId || "") ?>;
var paramUserName = <?!= JSON.stringify(userName || "") ?>;

var TG_USER = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : {};

var CHAT_ID = (paramChatId && paramChatId !== 'undefined' && paramChatId !== 'null')
  ? String(paramChatId)
  : (TG_USER.id || null);

var USER_NAME = (paramUserName && paramUserName !== 'undefined' && paramUserName !== 'null')
  ? String(paramUserName)
  : ([TG_USER.first_name, TG_USER.last_name].filter(Boolean).join(' ') || TG_USER.username || 'Участник');

console.log("CHAT_ID:", CHAT_ID, "USER_NAME:", USER_NAME);

function checkLaunch() {
  if (!CHAT_ID || CHAT_ID === 'undefined' || CHAT_ID === 'null') {
    document.getElementById('initialLoader').innerHTML =
      '<div class="error-box">' +
        '<div class="icon">!</div>' +
        '<h2>Приложение открыто не через кнопку</h2>' +
        '<p>Отправьте боту <code>/start</code> и нажмите inline-кнопку в сообщении.</p>' +
      '</div>';
    return false;
  }
  return true;
}

var STATE = {
  tab: 'rating',
  bootstrap: null,
  currentLeague: null,
  matches: {},
  selectedMatch: null,

  ratingMode: 'total',
  tourLeague: null,
  tourNumber: null,

  tourLoadedFor: null,

  // 👇 НОВОЕ
  privateLeagues: [],

  privateLeagueData: null

function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

function showToast(msg, type) {
  var t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function(){ t.className = 'toast'; }, 2200);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ===== HTML-шаблоны скелетонов ===== */

function skelRatingRows(count) {
  var n = count || 6;
  var html = '';
  for (var i = 0; i < n; i++) {
    html +=
      '<div class="skel-rating-row">' +
        '<div class="skel-rank"></div>' +
        '<div class="skel-body">' +
          '<div class="skel-name"></div>' +
          '<div class="skel-leagues"></div>' +
        '</div>' +
        '<div class="skel-points"></div>' +
      '</div>';
  }
  return html;
}

function skelMatchCards(count) {
  var n = count || 4;
  var html = '';
  for (var i = 0; i < n; i++) {

function openBoxModal(boxCode) {
  if (SHOP_STATE.opening) return;
  var b = (SHOP_STATE.data.boxes || []).filter(function (x) { return x.code === boxCode; })[0];
  if (!b) return;
  if (!b.canAfford) { showToast('Недостаточно XP', 'error'); return; }
  if (!confirm('Открыть «' + b.name + '» за ' + b.price + ' XP?')) return;

  SHOP_STATE.opening = true;
  haptic('medium');

  var backdrop = document.createElement('div');
  backdrop.id = 'boxModal';
  backdrop.className = 'modal-backdrop show';
  backdrop.innerHTML =
    '<div class="modal box-modal">' +
      '<div class="box-stage" id="boxStage">' +
        '<div class="box-sprite" id="boxSprite">' + escapeHtml(b.emoji || '📦') + '</div>' +
        '<div class="box-shine" id="boxShine"></div>' +
      '</div>' +
      '<div class="box-cards" id="boxCards"></div>' +
      '<div class="box-footer" id="boxFooter"></div>' +
    '</div>';
  backdrop.addEventListener('click', function (e) {
    if (e.target === backdrop && !SHOP_STATE.opening) closeBoxModal();
  });
  document.body.appendChild(backdrop);

  callServer('miniApp_openBox', CHAT_ID, USER_NAME, boxCode)
    .then(function (res) {
      if (!res || !res.ok) {
        showToast((res && res.error) || 'Ошибка', 'error');
        closeBoxModal();
        SHOP_STATE.opening = false;
        return;
      }
      SHOP_STATE.data.stats.balance = res.newBalance;
      b.canAfford = res.newBalance >= b.price;
      playBoxAnimation(res.cards, res.newBalance);
    })
    .catch(function (err) {
      showToast('Ошибка: ' + (err.message || err), 'error');
      closeBoxModal();
      SHOP_STATE.opening = false;
    });
}

function playBoxAnimation(cards, newBalance) {
  var sprite = document.getElementById('boxSprite');
  var shine  = document.getElementById('boxShine');

  if (sprite) sprite.classList.add('shake');

  setTimeout(function () {
    if (shine) shine.classList.add('flash');
    if (sprite) sprite.classList.add('pop');

    setTimeout(function () {
      var cardsBox = document.getElementById('boxCards');
      var footer   = document.getElementById('boxFooter');
      if (!cardsBox) return;

      var html = '';
      cards.forEach(function (c, i) { html += renderCardHtml(c, i); });
      cardsBox.innerHTML = html;

      // Поочерёдное появление + flip
      var els = cardsBox.querySelectorAll('.card-slot');
      els.forEach(function (el, i) {
        // 1. Появление
        setTimeout(function () {
          el.classList.add('revealed');
          haptic('light');
        }, 150 * i);

        // 2. Флип через 500мс
        setTimeout(function () {
          el.classList.add('flipped');
          haptic('medium');
        }, 500 + 150 * i);
      });

      // 3. Кнопка «Забрать» — после всех флипов
      var totalDelay = 500 + 150 * cards.length + 800;
      setTimeout(function () {
        if (footer) {
          footer.innerHTML =
            '<div class="box-new-balance">Баланс: ' + newBalance.toLocaleString('ru-RU') + ' XP</div>' +
            '<button class="box-collect-btn" onclick="closeBoxModal()">✨ Забрать</button>';
        }
      }, totalDelay);
    }, 250);
  }, 1200);
}

function renderCardHtml(c, idx) {
  var r = RARITY[c.rarity] || RARITY.common;
  var flag = COUNTRY_EMOJI[c.countryCode] || '🌍';
  var initials = (c.name || '?').split(' ').map(function (s) { return s[0]; }).slice(0, 2).join('');
  var isEpicPlus = ['epic','legendary','mythic'].indexOf(c.rarity) !== -1 ? ' epic-plus' : '';

  return '' +
    '<div class="card-slot' + isEpicPlus + '" data-rarity="' + c.rarity + '">' +
      '<div class="card-flip-inner">' +

        // ЗАДНЯЯ (рубашка)
        '<div class="card-face card-back">' +
          '<div class="card-back-pattern">⚽</div>' +
          '<div class="card-back-label">PACK</div>' +
        '</div>' +

        // ЛИЦЕВАЯ (игрок)
        '<div class="card-face card-front" data-rarity="' + c.rarity + '">' +
          '<div class="card-rarity">' + r.label + '</div>' +
          '<div class="card-avatar" style="border-color:' + r.color + '">' +
            '<span class="card-initials">' + escapeHtml(initials) + '</span>' +
            '<span class="card-flag">' + flag + '</span>' +
          '</div>' +
          '<div class="card-ovr" style="color:' + r.color + '">' + c.ovr + '</div>' +
          '<div class="card-pos">' + escapeHtml(c.position || '') + '</div>' +
          '<div class="card-name">' + escapeHtml(c.name) + '</div>' +
          '<div class="card-club">' + escapeHtml(c.club || '') + '</div>' +
        '</div>' +

      '</div>' +
    '</div>';
}

function closeBoxModal() {
  var m = document.getElementById('boxModal');
  if (m) m.remove();
  SHOP_STATE.opening = false;
  if (SHOP_STATE.data) renderShopContent();
}

function openCollection() {
  SHOP_STATE.viewingCollection = true;
  var box = document.getElementById('shopContent');
  if (box) box.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

  callServer('miniApp_getCollection', CHAT_ID, USER_NAME)
    .then(function (res) {
      if (!res || !res.ok) {
        if (box) box.innerHTML = '<div class="empty">Ошибка: ' +
          escapeHtml((res && res.error) || '') + '</div>';

function renderCollectionView(box) {
  if (!box) return;
  var d = SHOP_STATE.collection || { cards: [], stats: {} };
  var cards = d.cards || [];
  var s = d.stats || {};

  var html = '';
  html +=
    '<div class="coll-head">' +
      '<button class="coll-back" onclick="backFromCollection()">← Назад</button>' +
      '<div class="coll-title">Коллекция</div>' +
    '</div>';

  html +=
    '<div class="coll-stats">' +
      '<div class="coll-stat"><div class="num">' + (s.totalCards || 0) + '</div><div class="lbl">Всего</div></div>' +
      '<div class="coll-stat"><div class="num">' + (s.uniqueCards || 0) + '</div><div class="lbl">Уникальных</div></div>' +
      '<div class="coll-stat"><div class="num">' + (s.completionPct || 0) + '%</div><div class="lbl">Собрано</div></div>' +
    '</div>';

    // Мини-статистика по редкостям
var byRarity = s.byRarity || {};
var rarityOrder = ['mythic','legendary','epic','rare','common'];
var hasAny = rarityOrder.some(function(r) { return (byRarity[r] || 0) > 0; });

if (hasAny) {
  html += '<div class="rarity-stats">';
  rarityOrder.forEach(function(r) {
    var cnt = byRarity[r] || 0;
    if (!cnt) return;
    var info = RARITY[r];
    html += '<div class="rarity-chip" style="border-color:' + info.color + '">' +
      '<span class="rc-dot" style="background:' + info.color + '"></span>' +
      '<span class="rc-label">' + info.label + '</span>' +
      '<span class="rc-count">×' + cnt + '</span>' +
    '</div>';
  });
  html += '</div>';
}

  if (!cards.length) {
    html += '<div class="empty">Пока нет карточек.<br>Откройте первый бокс!</div>';
  } else {
    html += '<div class="coll-grid">';
    cards.forEach(function (c) {
      var r = RARITY[c.rarity] || RARITY.common;
      var flag = COUNTRY_EMOJI[c.countryCode] || '🌍';
      var initials = (c.name || '?').split(' ').map(function (x) { return x[0]; }).slice(0, 2).join('');
      html +=
        '<div class="card-mini" style="border-color:' + r.color + '">' +
          '<div class="cm-ovr" style="color:' + r.color + '">' + c.ovr + '</div>' +
          '<div class="cm-avatar" style="background:linear-gradient(135deg,' + r.color + '44,' + r.color + '22)">' +
            '<span>' + escapeHtml(initials) + '</span>' +
            '<span class="cm-flag">' + flag + '</span>' +
          '</div>' +
          '<div class="cm-name">' + escapeHtml(c.name) + '</div>' +
          '<div class="cm-meta">' + escapeHtml(c.position) + ' · ' + escapeHtml(c.club || '') + '</div>' +
          (c.quantity > 1 ? '<div class="cm-qty">×' + c.quantity + '</div>' : '') +
        '</div>';
    });
    html += '</div>';
  }
  box.innerHTML = html;
}

function backFromCollection() {
  SHOP_STATE.viewingCollection = false;
  renderShopContent();
}

function callServer(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject) {
    try {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if (!fn) {
        reject(new Error('Имя функции не задано'));
        return;
      }
      runner[fn].apply(runner, args);
    } catch (e) { reject(e); }
  });
}

function render() {
  var app = $('#app');
  var nav = $('#nav');
  nav.style.display = 'flex';
  $$('.nav-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.tab === STATE.tab);
  });

  try {
    if (STATE.tab === 'rating')      return renderRating(app);
    if (STATE.tab === 'matches')     return renderMatches(app);
    if (STATE.tab === 'leagues')     return renderLeaguesTab(app);    
    if (STATE.tab === 'predictions') return renderMyPredictions(app);
    if (STATE.tab === 'profile')     return renderProfile(app);
    if (STATE.tab === 'shop')        return renderShop(app);
    if (STATE.tab === 'quests')      return renderQuests(app);
  } catch (err) {
    console.error('render error:', err);
    app.innerHTML = '<div class="content"><div class="empty">Ошибка: ' +
      escapeHtml(err.message || err) + '</div></div>';
  }
}

      '<div class="rating-toggle-btn ' + (STATE.ratingMode === 'tour' ? 'active' : '') + '" data-mode="tour">📅 За тур</div>' +
    '</div>';

  if (STATE.ratingMode === 'total') {
    html += renderTotalRatingBody(leagues);
  } else {
    html += renderTourRatingBody(leagues);
  }

  app.innerHTML = html;

  $$('.rating-toggle-btn', app).forEach(function (btn) {
    btn.addEventListener('click', function () {
      var mode = btn.dataset.mode;
      if (STATE.ratingMode === mode) return;
      haptic('light');
      STATE.ratingMode = mode;
      render();
    });
  });

  if (STATE.ratingMode === 'total') {
    bindTotalRating(app);
  } else {
    bindTourRating(app);
  }
}

function renderTotalRatingBody(leagues) {
  var rating = (STATE.bootstrap && STATE.bootstrap.rating) || [];
  var leagueCodes = Object.keys(leagues);

  if (!rating.length) {
    return '<div class="content"><div class="empty">Рейтинг пуст.</div></div>';
  }

  var html = '<div class="content">';
  rating.forEach(function (r, idx) {
    var rank = idx + 1;
    var cls = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
    var medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank + '.';
    var leaguesLine = leagueCodes
      .filter(function (c) { return (r.leagues && r.leagues[c]) > 0; })
      .map(function (c) {
        var lg = leagues[c];
        var flag = lg && lg.flagClass
          ? '<span class="flag-icon ' + lg.flagClass + '" style="width:14px;height:10px;margin-right:3px"></span>'
          : (lg && lg.emoji ? lg.emoji : '');
        return flag + ' ' + r.leagues[c];
      })
      .join('  ');

    html +=
      '<div class="rating-row ' + cls + '">' +
        '<div class="rank">' + medal + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div class="name um-user-link" data-user="' + escapeHtml(r.name) + '" ' +
            'style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px">' +
            escapeHtml(r.name) +
          '</div>' +
          (leaguesLine ? '<div class="leagues">' + leaguesLine + '</div>' : '') +
        '</div>' +
        '<div class="points">' + r.points + '</div>' +
      '</div>';
  });
  html += '</div>';
  return html;
}

function bindTotalRating(app) {
  $$('.um-user-link', app).forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      openUserStatsModal(el.dataset.user);
    });
  });
}

function renderTourRatingBody(leagues) {
  var codes = Object.keys(leagues);
  if (!codes.length) return '<div class="content"><div class="empty">Нет лиг.</div></div>';

  if (!leagues[STATE.tourLeague]) STATE.tourLeague = codes[0];

  var html = '<div class="tour-selectors">';
  html += '<div class="tour-select-wrap"><select id="tourLeagueSelect">';
  codes.forEach(function (c) {
    var lg = leagues[c];
    html += '<option value="' + c + '"' + (c === STATE.tourLeague ? ' selected' : '') + '>' +
      escapeHtml(lg.name) +
    '</option>';
  });
  html += '</select></div>';

  var tours = STATE.tours[STATE.tourLeague] || [];
  html += '<div class="tour-select-wrap"><select id="tourNumberSelect"' +
    (tours.length === 0 ? ' disabled' : '') + '>';
  if (tours.length === 0) {
    html += '<option>—</option>';
  } else {
    tours.forEach(function (t) {
      var label = t.label;
      if (!t.finished) label += ' (' + t.played + '/' + t.total + ')';
      html += '<option value="' + t.number + '"' +
        (t.number === STATE.tourNumber ? ' selected' : '') + '>' +
        escapeHtml(label) +
      '</option>';
    });
  }
  html += '</select></div></div>';

  html += '<div class="content" id="tourRatingBody">';

  if (tours.length === 0) {
    html += '<div class="tour-empty">Загружаем туры...</div>';
  } else if (!STATE.tourRating) {
    html += '<div class="loader"><div class="spinner"></div></div>';
  }

  html += '</div>';
  return html;
}

function bindTourRating(app) {
  var leagueSel = $('#tourLeagueSelect');
  var tourSel = $('#tourNumberSelect');

  if (leagueSel) {
    leagueSel.addEventListener('change', function () {
      STATE.tourLeague = leagueSel.value;
      STATE.tourNumber = null;
      STATE.tourRating = null;
      loadTours(STATE.tourLeague, true);
    });
  }

  if (tourSel) {
    tourSel.addEventListener('change', function () {
      STATE.tourNumber = parseInt(tourSel.value, 10);
      STATE.tourRating = null;
      loadTourRating(STATE.tourLeague, STATE.tourNumber);
    });
  }

  if (!STATE.tours[STATE.tourLeague]) {
    loadTours(STATE.tourLeague, true);
  } else if (STATE.tourNumber) {
    if (!STATE.tourRating) {
      loadTourRating(STATE.tourLeague, STATE.tourNumber);
    } else {
      renderTourRatingList();
    }
  } else {
    var tours = STATE.tours[STATE.tourLeague];
    if (tours && tours.length) {
      STATE.tourNumber = tours[tours.length - 1].number;
      var ts = $('#tourNumberSelect');
      if (ts) ts.value = String(STATE.tourNumber);
      loadTourRating(STATE.tourLeague, STATE.tourNumber);
    }
  }
}

function loadTours(leagueCode, autoSelectLast) {
  var body = $('#tourRatingBody');
  if (body) body.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

  callServer('miniApp_getAvailableTours', leagueCode)
    .then(function (res) {
      if (!res || !res.ok) {
        if (body) body.innerHTML = '<div class="tour-empty">Ошибка: ' +
          escapeHtml((res && res.error) || 'не удалось загрузить туры') + '</div>';
        return;
      }
      STATE.tours[leagueCode] = res.tours || [];
      updateTourSelect(leagueCode);

      if (autoSelectLast && STATE.tours[leagueCode].length) {
        STATE.tourNumber = STATE.tours[leagueCode][STATE.tours[leagueCode].length - 1].number;
        var ts = $('#tourNumberSelect');
        if (ts) ts.value = String(STATE.tourNumber);
        loadTourRating(leagueCode, STATE.tourNumber);
      } else if (STATE.tours[leagueCode].length === 0) {
        if (body) body.innerHTML = '<div class="tour-empty">В этой лиге пока нет туров</div>';
      }
    })
    .catch(function (err) {
      if (body) body.innerHTML = '<div class="tour-empty">Ошибка: ' +
        escapeHtml(err.message || err) + '</div>';
    });
}

function updateTourSelect(leagueCode) {
  var tourSel = $('#tourNumberSelect');
  if (!tourSel) return;
  var tours = STATE.tours[leagueCode] || [];
  tourSel.innerHTML = '';

  if (!tours.length) {
    tourSel.disabled = true;
    tourSel.innerHTML = '<option>—</option>';
    return;
  }
  tourSel.disabled = false;
  tours.forEach(function (t) {
    var label = t.label;
    if (!t.finished) label += ' (' + t.played + '/' + t.total + ')';
    var opt = document.createElement('option');
    opt.value = String(t.number);
    opt.textContent = label;
    if (t.number === STATE.tourNumber) opt.selected = true;
    tourSel.appendChild(opt);
  });
}

function loadTourRating(leagueCode, tourNumber) {
  var body = $('#tourRatingBody');
  if (body) body.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

  callServer('miniApp_getTourRating', leagueCode, tourNumber)
    .then(function (res) {
      if (!res || !res.ok) {
        if (body) body.innerHTML = '<div class="tour-empty">Ошибка: ' +
          escapeHtml((res && res.error) || 'не удалось загрузить') + '</div>';
        return;
      }
      STATE.tourRating = res;
      renderTourRatingList();
    })
    .catch(function (err) {
      if (body) body.innerHTML = '<div class="tour-empty">Ошибка: ' +
        escapeHtml(err.message || err) + '</div>';
    });
}

function renderTourRatingList() {
  var body = $('#tourRatingBody');
  if (!body) return;
  var data = STATE.tourRating;
  if (!data) return;

  var rating = data.rating || [];

  var html = '';

  html +=
    '<div class="tour-info">' +
      '<div class="tour-info-box"><div class="num">' + data.totalMatches + '</div><div class="lbl">Матчей</div></div>' +
      '<div class="tour-info-box"><div class="num">' + data.playedMatches + '</div><div class="lbl">Сыграно</div></div>' +
      '<div class="tour-info-box"><div class="num">' + rating.length + '</div><div class="lbl">Участников</div></div>' +
    '</div>';

  if (!rating.length) {
    if (data.playedMatches === 0) {
      html += '<div class="tour-empty">Тур ещё не начался.<br>Рейтинг появится после первых матчей.</div>';
    } else {
      html += '<div class="tour-empty">Никто не сделал прогнозы на этот тур</div>';
    }
    body.innerHTML = html;
    return;
  }

  rating.forEach(function (r) {
    var isMe = (r.userName === USER_NAME);
    var cls = '';
    if (isMe) cls += ' me';
    if (r.place === 1) cls += ' top1';
    else if (r.place === 2) cls += ' top2';
    else if (r.place === 3) cls += ' top3';

    var medal = r.place === 1 ? '🥇' : r.place === 2 ? '🥈' : r.place === 3 ? '🥉' : r.place;

    var sub = r.count + ' прогноз.';
    if (r.resolved > 0) {
      sub += ' · ✅ ' + r.exactCount + ' 🎯 ' + r.diffCount + ' ⚖️ ' + r.outcomeCount;
    }

    html +=
      '<div class="tour-rating-row um-user-link' + cls + '" data-user="' + escapeHtml(r.userName) + '">' +
        '<div class="tr-place">' + medal + '</div>' +
        '<div class="tr-body">' +
          '<div class="tr-name">' + escapeHtml(r.userName) +
            (isMe ? ' <span style="font-size:11px;color:var(--accent)">(вы)</span>' : '') +
          '</div>' +
          '<div class="tr-sub">' + escapeHtml(sub) + '</div>' +
        '</div>' +
        '<div class="tr-points">' + r.points + '</div>' +
      '</div>';
  });

  body.innerHTML = html;

  $$('.tour-rating-row.um-user-link', body).forEach(function (el) {
    el.addEventListener('click', function () {
      openUserStatsModal(el.dataset.user);
    });
  });
}

function loadLeagueMatchesList(leagueId) {
  var box = document.getElementById('leagueMatchesList');
  if (!box) return;

  callServer('miniApp_getLeagueMatchesList', leagueId, CHAT_ID, USER_NAME)
    .then(function(res) {
      if (!res || !res.ok || !res.matches.length) {
        box.innerHTML = '<div class="empty" style="padding:10px">Нет добавленных матчей.</div>';
        return;
      }

      var html = '';
      res.matches.forEach(function(m, idx) {
        var isStarted = false;
        if (m.matchDateStr) {
          if (new Date().getTime() >= new Date(m.matchDateStr).getTime()) isStarted = true;
        }

        var scoreStr = m.realScore ? '<b style="color:var(--win)">' + escapeHtml(m.realScore) + '</b>' : '';

        html += '<div class="league-match-item" data-index="' + idx + '">' +
          '<div class="info">' +
            '<div class="name">' + escapeHtml(m.matchName) + '</div>' +
            '<div class="time">' + escapeHtml(m.timeStr) + ' · ' + escapeHtml(m.leagueCode) + '</div>' +
          '</div>';
          
        if (scoreStr) {
          html += '<div style="font-size:16px;margin-left:10px">' + scoreStr + '</div>';
        }
        html += '</div>';

        // Блок прогноза
        if (!m.realScore) {
          html += '<div class="league-match-pred" id="leaguePredBox-' + idx + '">';
          
          if (isStarted) {
            html += '<div style="text-align:center;font-size:12px;color:var(--hint)">⏳ Матч начался, прогнозы закрыты</div>';
          } else if (m.userPrediction) {
            html += '<div class="pred-done" style="padding:6px">' +
              '<div class="pred-done-left">' +
                '<div class="pred-done-label">Ваш прогноз</div>' +
                '<div class="pred-done-value">' + escapeHtml(m.userPrediction.outcome) + ' — ' + escapeHtml(m.userPrediction.score) + '</div>' +
              '</div>' +
              '<div class="pred-done-check">✓</div>' +
            '</div>';
          } else {
            // Рисуем кнопки
            html += '<div class="league-odds-row">' +
              '<div class="league-odds-btn" data-outcome="П1">П1</div>' +
              '<div class="league-odds-btn" data-outcome="Ничья">X</div>' +
              '<div class="league-odds-btn" data-outcome="П2">П2</div>' +
            '</div>' +
            '<div class="league-score-row" id="leagueScoreRow-' + idx + '">' +
              '<input type="tel" inputmode="numeric" maxlength="2" placeholder="0" id="leagueScoreHome-' + idx + '">' +
              '<span>:</span>' +
              '<input type="tel" inputmode="numeric" maxlength="2" placeholder="0" id="leagueScoreAway-' + idx + '">' +
              '<button data-league-save="' + idx + '">ОК</button>' +
            '</div>';
          }
          html += '</div>';
        }
      });
      
      box.innerHTML = html;

      // Обработчики событий
      res.matches.forEach(function(m, idx) {
        var predBox = document.getElementById('leaguePredBox-' + idx);
        if (!predBox || predBox.querySelector('.pred-done') || predBox.querySelector('div[style*="закрыты"]')) return;

        var selectedOutcome = null;
        var btns = predBox.querySelectorAll('.league-odds-btn');
        
        btns.forEach(function(btn) {
          btn.addEventListener('click', function() {
            btns.forEach(function(b) { b.classList.remove('selected'); });
            btn.classList.add('selected');
            selectedOutcome = btn.dataset.outcome;
            
            var scoreRow = document.getElementById('leagueScoreRow-' + idx);
            if (scoreRow) scoreRow.classList.add('visible');
          });
        });

        var saveBtn = predBox.querySelector('[data-league-save]');
        if (saveBtn) {
          saveBtn.addEventListener('click', function() {
            if (!selectedOutcome) { showToast('Выберите исход', 'error'); return; }
            var h = document.getElementById('leagueScoreHome-' + idx).value.trim();
            var a = document.getElementById('leagueScoreAway-' + idx).value.trim();
            if (!/^\d+$/.test(h) || !/^\d+$/.test(a)) { showToast('Введите счет', 'error'); return; }
            
            saveLeaguePrediction(m.matchName, m.leagueCode, selectedOutcome, h + '-' + a, leagueId);
          });
        }
      });
    })
    .catch(function() {
      box.innerHTML = '<div class="empty">Ошибка загрузки матчей</div>';
    });
}

function copyInviteCode() {
  var el = document.getElementById('invCode');
  if (!el) return;
  var code = el.textContent.trim();
  try {
    navigator.clipboard.writeText(code);
    showToast('Код скопирован: ' + code, 'success');
    haptic('light');
  } catch (e) {
    showToast('Не удалось скопировать', 'error');
  }
}

function shareInvite(code, leagueName) {
  // Берем botUsername из шаблона, который передается из doGet
  var rawBot = <?!= JSON.stringify(botUsername || '') ?>;
  var botUser = String(rawBot || '').replace(/^@/, '').trim();
  if (!botUser || botUser === 'YourBotUsername') botUser = '';

  var deepLink = botUser ? 'https://t.me/' + botUser + '?start=league_' + code : '';
  var shareText = '🏆 Присоединяйся к моей лиге «' + leagueName + '»!\n\nКод: ' + code;
  if (deepLink) shareText += '\n\nИли перейди по ссылке: ' + deepLink;

  var urlParam = deepLink || 'https://t.me/share/url';
  var shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(urlParam) + '&text=' + encodeURIComponent(shareText);

  try {
    if (tg && typeof tg.openTelegramLink === 'function') {
      tg.openTelegramLink(shareUrl);
      return;
    }
    if (tg && typeof tg.openLink === 'function') {
      tg.openLink(shareUrl);
      return;
    }
  } catch (e) { console.warn(e); }

  copyInviteCode();
  showToast('Ссылка не открылась — код скопирован', 'success');
}

function openCreateLeagueModal() {
  var backdrop = document.getElementById('createLeagueModal');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'createLeagueModal';
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = '<div class="modal" id="createLeagueModalBody"></div>';
    backdrop.addEventListener('click', function (e) {
      if (e.target === backdrop) backdrop.classList.remove('show');
    });

function renderMatches(app) {
  var data = STATE.bootstrap || {};
  var leagues = data.leagues || {};
  var codes = Object.keys(leagues);

  if (!codes.length) {
    app.innerHTML = '<div class="content"><div class="empty">Нет данных о лигах. Обновите страницу.</div></div>';
    return;
  }

  if (!STATE.currentLeague) {
    renderLeaguesList(app, leagues, codes);
  } else {
    renderLeagueMatchesView(app, leagues, STATE.currentLeague);
  }

function loadMatches(leagueCode) {
  var list = $('#matchList');
  if (!list) return;
  list.innerHTML = skelMatchCards(4);

  callServer('miniApp_getLeagueMatches', leagueCode, CHAT_ID, USER_NAME)
    .then(function(res) {
      if (!res || !res.ok) throw new Error((res && res.error) || 'Ошибка');
      if (!STATE.matches) STATE.matches = {};
      STATE.matches[leagueCode] = res.matches || [];
      renderMatchesList(leagueCode);
    })
    .catch(function(err) {
      list.innerHTML = '<div class="empty">Ошибка: ' + escapeHtml(err.message || err) + '</div>';
    });
}

function renderMatchesList(leagueCode) {
  var list = $('#matchList');
  if (!list) return;
  var matches = STATE.matches[leagueCode] || [];
  if (!matches.length) {
    var filter = STATE.matchFilter || 'all';
matches = matches.filter(function(m) {
  var has = !!(m.userPrediction && m.userPrediction.outcome);
  if (filter === 'done') return has;
  if (filter === 'todo') return !has;
  return true;
});
if (!matches.length) {
  list.innerHTML = '<div class="empty">Нет матчей с этим фильтром</div>';
  return;
}
    list.innerHTML = '<div class="empty">Нет доступных матчей</div>';
    return;
  }

  var html = '';
  matches.forEach(function(m, i) {
    var already = m.userPrediction && m.userPrediction.outcome;
    var sel = (!already && STATE.selectedMatch && STATE.selectedMatch.matchName === m.matchName) ? STATE.selectedMatch : null;

    var isStarted = false;
    if (m.matchDateStr) {
      var matchTs = new Date(m.matchDateStr).getTime();
      if (new Date().getTime() >= matchTs) isStarted = true;
    }

    var parts = String(m.matchName).split(/\s*[-–—]\s*/);
    var team1 = m.homeTeam ? (m.homeTeam.shortName || m.homeTeam.name) : (parts[0] || '');
    var team2 = m.awayTeam ? (m.awayTeam.shortName || m.awayTeam.name) : (parts[1] || '');

    var cardClass = 'match-card';
    if (sel) cardClass += ' expanded';
    if (already) cardClass += ' done';

    html += '<div class="' + cardClass + '" data-match-index="' + i + '">';

    // Левая часть: время + команды
    html += '<div class="match-head">';
    if (m.time) {
      html += '<div class="match-time">' + escapeHtml(m.time) + '</div>';
    }
    html += matchTeamsHtml(m);
    html += '</div>';

    // Правая часть
    if (already) {
      html += '<div class="odds-btn selected" style="pointer-events:none;cursor:default">' +
        '<span class="odds-label">' + escapeHtml(m.userPrediction.outcome) + '</span>' +
        '<span class="odds-sub">' + escapeHtml(m.userPrediction.score) + '</span>' +
      '</div>';
      html += '<div class="pred-done-mini">✓</div>';
    } else if (isStarted) {
      html += '<div class="match-locked">начался</div>';
    } else {
      html +=
        '<div class="odds-row">' +
          '<div class="odds-btn' + (sel && sel.outcome === 'П1' ? ' selected' : '') + '" data-outcome="П1">' +
            '<span class="odds-label">П1</span>' +
            '<span class="odds-sub">' + escapeHtml(team1) + '</span>' +
          '</div>' +
          '<div class="odds-btn' + (sel && sel.outcome === 'Ничья' ? ' selected' : '') + '" data-outcome="Ничья">' +
            '<span class="odds-label">X</span>' +
            '<span class="odds-sub">ничья</span>' +
          '</div>' +
          '<div class="odds-btn' + (sel && sel.outcome === 'П2' ? ' selected' : '') + '" data-outcome="П2">' +
            '<span class="odds-label">П2</span>' +
            '<span class="odds-sub">' + escapeHtml(team2) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="score-inline" id="scoreRow-' + i + '" style="display:' + (sel ? 'flex' : 'none') + '">' +
          '<input type="tel" inputmode="numeric" maxlength="2" placeholder="0" id="scoreHome-' + i + '">' +
          '<span class="score-colon">:</span>' +
          '<input type="tel" inputmode="numeric" maxlength="2" placeholder="0" id="scoreAway-' + i + '">' +
          '<button class="score-save" data-save="1">✓</button>' +
        '</div>';
    }

    html += '</div>';
  });

  list.innerHTML = html;

  $$('.match-card').forEach(function(card) {
    var idx = parseInt(card.dataset.matchIndex, 10);
    var m = matches[idx];
    if (m.userPrediction && m.userPrediction.outcome) return;
    var matchStarted = false;
    if (m.matchDateStr) {
      if (new Date().getTime() >= new Date(m.matchDateStr).getTime()) matchStarted = true;
    }
    if (matchStarted) return;

    $$('.odds-btn', card).forEach(function(btn) {
      btn.addEventListener('click', function() {
        $$('.odds-btn', card).forEach(function(b) { b.classList.remove('selected'); });
        btn.classList.add('selected');

        STATE.selectedMatch = {
          matchName: m.matchName,
          leagueCode: leagueCode,
          outcome: btn.dataset.outcome
        };

        var row = document.getElementById('scoreRow-' + idx);
        if (row) {
          row.style.display = 'flex';
          var h = document.getElementById('scoreHome-' + idx);
          if (h) h.focus();
        }
        card.classList.add('expanded');
      });
    });

    var saveBtn = card.querySelector('[data-save]');
    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        var s = STATE.selectedMatch;
        if (!s || s.matchName !== m.matchName) {
          showToast('Выберите исход', 'error');
          return;
        }
        var h = document.getElementById('scoreHome-' + idx).value.trim();
        var a = document.getElementById('scoreAway-' + idx).value.trim();
        if (!/^\d+$/.test(h) || !/^\d+$/.test(a)) {
          showToast('Введите счёт', 'error');
          return;
        }
        savePrediction(m.matchName, leagueCode, s.outcome, h + '-' + a, false);
      });
    }
  });
}

function savePrediction(matchName, leagueCode, outcome, score, useJoker) {
  showToast('Сохранение...');
  callServer('miniApp_savePrediction', {
    chatId: CHAT_ID,
    userName: USER_NAME,
    matchName: matchName,
    leagueCode: leagueCode,
    outcome: outcome,
    score: score,
    useJoker: !!useJoker // 🔥
  })
  .then(function(res) {
    if (res.ok) {
      showToast('Прогноз сохранен', 'success');
      haptic('light'); // 🔧 NEW
      STATE.selectedMatch = null;

      if (res.xp) {
        showXPToast('+' + res.xp.xpGained + ' XP');
        if (res.xp.leveledUp) {
          setTimeout(function(){ showLevelUp(res.xp.level); }, 600);
        }
      }

      var arr = STATE.matches[leagueCode] || [];
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].matchName === matchName) {
          arr[i].userPrediction = {
            outcome: outcome,
            score: score.replace(/\s/g, '').replace(/:/g, '-')
          };
          break;
        }
      }
      renderMatchesList(leagueCode);
    } else {
      if (res.alreadyExists) {
        showToast(res.error || 'Прогноз уже сделан', 'error');
        STATE.selectedMatch = null;
        loadMatches(leagueCode);
      } else {
        showToast(res.error || 'Ошибка', 'error');
      }
    }
  })
  .catch(function(err) { showToast('Ошибка: ' + (err.message || err), 'error'); });
}

function renderMyPredictions(app) {
  app.innerHTML =
    '<div class="header">' +
      '<h1>Мои прогнозы</h1>' +
      '<div class="sub">Последние 25 матчей</div>' +
    '</div>' +
    '<div class="content" id="predList">' + skelPredRows(5) + '</div>';

  callServer('miniApp_getUserPredictions', CHAT_ID, USER_NAME)
    .then(function(res) {
      var list = $('#predList');
      if (!list) return;

      if (!res || !res.ok) {
        list.innerHTML = '<div class="empty">Ошибка: ' +
          escapeHtml((res && res.error) || 'не удалось загрузить') + '</div>';
        return;
      }

        var preds = (res.predictions || []).slice(); 
      
      // ✅ СОРТИРУЕМ ПО ID (кто последний сохранился, у того id больше)
      preds.sort(function(a, b) {
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      preds = preds.slice(0, 25);
      if (!preds.length) {
        list.innerHTML = '<div class="empty">Нет прогнозов</div>';
        return;
      }

      var html = '';
      preds.forEach(function(p, idx) {
        var isLatest = idx === 0;

        var isPlayed = p.realScore !== null &&
                       p.realScore !== undefined &&
                       p.realScore !== '';

        var resultHtml;
        if (isPlayed) {
          var pts = (p.points === null || p.points === undefined) ? 0 : Number(p.points);
          var color = pts >= 5 ? 'var(--win)' :
                      (pts >= 3 ? 'var(--accent)' :
                      (pts > 0 ? 'var(--accent)' : 'var(--lose)'));
          resultHtml =
            '<div class="result">Реальный счёт: <b>' + escapeHtml(p.realScore) + '</b> · ' +
            'Очки: <b style="color:' + color + '">+' + pts + '</b></div>' +
            '<button class="gif-btn" ' +
              'onclick="openHighlights(\'' + escapeHtml(p.matchName).replace(/'/g, "\\'") + '\', \'' +
              escapeHtml(p.realScore) + '\', \'' + escapeHtml(p.leagueCode || '') + '\')">' +
              '🎬 Хайлайты' +
            '</button>';
        } else {
          resultHtml = '<div class="result pending">Матч не сыгран</div>';
        }

        html += '<div class="pred-row' + (isLatest ? ' pred-row-latest' : '') + '">' +
          (isLatest ? '<div class="pred-latest-badge">Последний прогноз</div>' : '') +
          '<div class="pred-teams">' + matchTeamsHtml(p) + '</div>' +
          '<div class="meta">' + escapeHtml(p.leagueName) + ' · ' + escapeHtml(p.dateStr) + '</div>' +
          '<div class="guess">Ваш прогноз: <b>' + escapeHtml(p.outcome) +
            '    ' + escapeHtml(p.score) + '</b></div>' +
          resultHtml +
          '<button class="compare-btn" ' +
            'data-match="' + escapeHtml(p.matchName) + '" ' +
            'data-league="' + escapeHtml(p.leagueCode || '') + '">' +
            'Сравнить матч' +
          '</button>' +
        '</div>';
      });

      list.innerHTML = html;

      $$('.compare-btn', list).forEach(function(btn) {
        btn.addEventListener('click', function() {
          openCompareModal(btn.dataset.match, btn.dataset.league);
        });
      });
    })
    .catch(function(err) {
      var list = $('#predList');
      if (list) {
        list.innerHTML = '<div class="empty">Ошибка: ' +
          escapeHtml(err.message || err) + '</div>';
      }
    });
}

                (s.Draw ? '<div class="bar-seg bar-draw" style="width:' + s.pctDraw + '%"></div>' : '') +
                (s.P2 ? '<div class="bar-seg bar-p2" style="width:' + s.pctP2 + '%"></div>' : '') +
              '</div>' +
            '</div>';
        }
      }
      var preds = res.predictions || [];
      if (!preds.length) {
        el.innerHTML = '<div class="cmp-empty">Пока никто не сделал прогноз</div>';
        return;
      }
      var html = '';
      preds.forEach(function(p) {
        var isMe = (p.userName === USER_NAME);
        html += '<div class="cmp-row' + (isMe ? ' me' : '') + '">' +
          '<div style="flex:1">' +
            '<div class="cmp-name">' + escapeHtml(p.userName) +
              (isMe ? ' <span style="font-size:11px;color:var(--accent)">(вы)</span>' : '') +

          '</div>' +
          '<div class="cmp-score">' + escapeHtml(p.score) + '</div>' +
        '</div>';
      });
      el.innerHTML = html;
    })
    .catch(function(err) {
      var el = document.getElementById('compareBody');
      if (el) el.innerHTML = '<div class="cmp-empty">Ошибка: ' +
        escapeHtml(err.message || err) + '</div>';
    });

function saveNotifyModal() {
  var box = document.getElementById('notifyBody');
  if (!box) return;

  var codes = [];
  $$('.notify-item', box).forEach(function(item) {
    var cb = item.querySelector('input[type="checkbox"]');
    if (cb && cb.checked) codes.push(item.dataset.code);
  });

  var btn = box.querySelector('.notify-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Сохранение...'; }

  callServer('miniApp_saveNotifySettings', CHAT_ID, USER_NAME, codes)
    .then(function(res) {
      if (res && res.ok) {
        showToast('Настройки сохранены', 'success');
        closeNotifyModal();
      } else {
        showToast((res && res.error) || 'Ошибка', 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Сохранить'; }
      }
    })
    .catch(function(err) {
      showToast('Ошибка: ' + (err.message || err), 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Сохранить'; }
    });
}

  var p = res.profile;

  html += renderXPCard_(p);

  if (tasks.daily && tasks.daily.length) {
    html += '<div class="tasks-section">' +
      '<div class="tasks-section-title">📅 Ежедневные</div>';
    tasks.daily.forEach(function(t) { html += renderTaskCard(t); });
    html += '</div>';
  }

  if (tasks.weekly && tasks.weekly.length) {
    html += '<div class="tasks-section">' +
      '<div class="tasks-section-title">📆 Еженедельные</div>';
    tasks.weekly.forEach(function(t) { html += renderTaskCard(t); });
    html += '</div>';

  if (tasks.monthly && tasks.monthly.length) {
    html += '<div class="tasks-section">' +
      '<div class="tasks-section-title">🗓 Ежемесячные</div>';
    tasks.monthly.forEach(function(t) { html += renderTaskCard(t); });

        .then(function(r) {

          btn.textContent = 'Забрать';

    });

function renderProfileDashboard(res) {
  var xpBox = document.getElementById('pfXPCard');

    xpBox.innerHTML = renderXPCard_(res.xp);
  }
  var sub = document.querySelector('.pf-sub');
  if (sub) {
    var safeUsername = (TG_USER && TG_USER.username) ? '@' + TG_USER.username + ' · ' : '';
    sub.textContent = safeUsername + 'Место ' + (res.place || '-') + ' из ' + (res.totalPlayers || 0);
  }

  var stats = document.getElementById('pfStats');
  if (stats) {
    stats.innerHTML =
    '<div class="pf-stat"><div class="pf-stat-num">' + (res.points || 0) + '</div><div class="pf-stat-lbl">Очков</div></div>' +
    '<div class="pf-stat"><div class="pf-stat-num">' + (res.totalPredictions || 0) + '</div><div class="pf-stat-lbl">Прогнозов</div></div>';
  }

  var accBody = document.getElementById('pfAccuracyBody');

          ? '<span class="flag-icon ' + l.flagClass + '" style="width:16px;height:11px"></span>'

            '<div class="pf-lg-body">' +

                '<div class="pf-lg-meta-box"><div class="num">' + l.predictions + '</div><div class="lbl">Прогнозов</div></div>' +
                '<div class="pf-lg-meta-box"><div class="num">' + l.points + '</div><div class="lbl">Очков</div></div>' +
                '<div class="pf-lg-meta-box"><div class="num">' + l.resolved + '</div><div class="lbl">Сыграно</div></div>' +
              '</div>' +

                    lsBar_('Исход',       l.pctOutcome, l.outcomeHit, l.resolved, 'oc') +
                    lsBar_('Разница',     l.pctDiff,    l.diffHit,    l.resolved, 'df') +
                    lsBar_('Точный счёт', l.pctScore,   l.scoreHit,   l.resolved, 'sc') +
                  '</div>'
                : '<div class="pf-empty">Ещё нет сыгранных матчей</div>') +

function lsBar_(label, pct, hit, total, mod) {
  var p = Math.max(0, Math.min(100, Number(pct) || 0));
  return '' +
    '<div class="ls-bar ls-bar-' + mod + '">' +
      '<div class="ls-bar-top">' +
        '<span class="ls-bar-lbl">' + escapeHtml(label) + '</span>' +
        '<span class="ls-bar-val">' + p + '% <span class="ls-bar-cnt">(' + hit + '/' + total + ')</span></span>' +
      '</div>' +
      '<div class="ls-bar-track"><div class="ls-bar-fill" style="width:' + p + '%"></div></div>' +
    '</div>';
}

$$('.nav-item').forEach(function(el) {
  el.addEventListener('click', function() {
    if (STATE.tab === el.dataset.tab) {
      // Если мы уже в лигах, но зашли внутрь лиги — вернемся к списку
      if (STATE.tab === 'leagues' && STATE.currentPrivateLeague) {
        STATE.currentPrivateLeague = null;
        render();
      }
      return;
    }
    
    STATE.tab = el.dataset.tab;
    STATE.selectedMatch = null;

    if (STATE.tab !== 'matches') {
      STATE.currentLeague = null;
    }
    if (STATE.tab === 'leagues') {
      STATE.currentPrivateLeague = null; // Всегда показываем список при переходе
    }
    render();
  });
});

/* ============================================================
   TEAM BUILDER — конструктор команды
   ============================================================ */
var TEAM_STATE = {
  data: null,          // ответ от miniApp_getTeamBuilder
  tempSlots: {},       // {slotIndex: cardObject}
  tempCoach: null,
  pickingSlot: null,   // индекс слота, для которого выбираем карточку
  pickingCoach: false
};

function openTeamBuilder() {
  var backdrop = document.getElementById('teamBuilderModal');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'teamBuilderModal';
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = '<div class="modal team-builder-modal" id="teamBuilderModalBody"></div>';
    document.body.appendChild(backdrop);
  }
  var body = document.getElementById('teamBuilderModalBody');
  body.innerHTML =
    '<div class="modal-head">' +
      '<h3>⚽ Моя команда</h3>' +
      '<button class="modal-close" onclick="closeTeamBuilder()">×</button>' +
    '</div>' +
    '<div id="teamBuilderContent"><div class="loader"><div class="spinner"></div></div></div>';
  backdrop.classList.add('show');

  callServer('miniApp_getTeamBuilder', CHAT_ID, USER_NAME).then(function (res) {
    var content = document.getElementById('teamBuilderContent');
    if (!content) return;
    if (!res || !res.ok) {
      content.innerHTML = '<div class="empty">Ошибка: ' +
        escapeHtml((res && res.error) || '') + '</div>';
      return;
    }
    TEAM_STATE.data = res;
    TEAM_STATE.tempSlots = {};
    TEAM_STATE.tempCoach = res.coachCard;
    res.slots.forEach(function (s) {
      if (s.card) TEAM_STATE.tempSlots[s.index] = s.card;
    });
    renderTeamBuilder();
  });
}

function renderTeamBuilder() {
  var content = document.getElementById('teamBuilderContent');
  if (!content) return;
  var d = TEAM_STATE.data;
  if (!d) return;

  var slots = d.slots.map(function (def) {
    return {
      index: def.index,
      group: def.group,
      label: def.label,
      card: TEAM_STATE.tempSlots[def.index] || null
    };
  });

  var filled = slots.filter(function (s) { return s.card; }).length;
  var coach = TEAM_STATE.tempCoach;
  var isComplete = filled === 11 && !!coach;
  var power = isComplete ? calcTeamPowerLocal_(slots, coach) : null;

  var html = '';

  // Поле
  html += '<div class="tb-field">';
  html += '<div class="tb-row tb-row-fwd">';
  slots.filter(function (s) { return s.group === 'FWD'; }).forEach(function (s) {
    html += renderTeamSlotHtml_(s);
  });
  html += '</div>';
  html += '<div class="tb-row tb-row-mid">';
  slots.filter(function (s) { return s.group === 'MID'; }).forEach(function (s) {
    html += renderTeamSlotHtml_(s);
  });
  html += '</div>';
  html += '<div class="tb-row tb-row-def">';
  slots.filter(function (s) { return s.group === 'DEF'; }).forEach(function (s) {
    html += renderTeamSlotHtml_(s);
  });
  html += '</div>';
  html += '<div class="tb-row tb-row-gk">';
  slots.filter(function (s) { return s.group === 'GK'; }).forEach(function (s) {
    html += renderTeamSlotHtml_(s);
  });
  html += '</div>';
  html += '</div>';

  // Тренер
  html += '<div class="tb-coach-block">';
  html += '<div class="tb-coach-label">Тренер</div>';
  html += renderTeamCoachHtml_(coach);
  html += '</div>';

  // Инфо
  html += '<div class="tb-info">';
  html += '<div class="tb-info-box"><div class="num">' + filled + '/11</div><div class="lbl">Игроков</div></div>';
  html += '<div class="tb-info-box"><div class="num">' + (power || '—') + '</div><div class="lbl">Сила</div></div>';
  html += '<div class="tb-info-box"><div class="num">' + (coach ? '✓' : '—') + '</div><div class="lbl">Тренер</div></div>';
  html += '</div>';

  html += '<input type="text" id="teamNameInput" maxlength="40" ' +
    'placeholder="Название команды" value="' + escapeHtml(d.teamName || 'Моя команда') + '" ' +
    'style="width:100%;padding:12px;background:var(--bg2);border:1px solid var(--line);' +
    'border-radius:10px;color:var(--text);font-size:14px;margin-bottom:12px">';

  html += '<button id="saveTeamBtn" class="notify-save-btn" ' +
    (isComplete ? '' : 'disabled') + '>' +
    (isComplete ? '💾 Сохранить команду' : 'Заполните все позиции') +
    '</button>';

  content.innerHTML = html;

  // Bindings
  content.querySelectorAll('.tb-slot').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = parseInt(el.dataset.slot, 10);
      openCardPicker(idx);
    });
  });
  var coachEl = content.querySelector('.tb-coach');
  if (coachEl) coachEl.addEventListener('click', openCoachPicker);

  var saveBtn = document.getElementById('saveTeamBtn');
  if (saveBtn && isComplete) {
    saveBtn.addEventListener('click', submitTeam);
  }
}

function calcTeamPowerLocal_(slots, coach) {
  var sum = 0, count = 0;
  slots.forEach(function (s) {
    if (s.card) { sum += Number(s.card.ovr) || 0; count++; }
  });
  if (!count) return 0;
  var avg = sum / count;
  var bonus = coach ? (Number(coach.ovr) || 0) * 0.1 : 0;
  return Math.round((avg + bonus) * 100) / 100;
}

function renderTeamSlotHtml_(slot) {
  var card = slot.card;
  if (!card) {
    return '<div class="tb-slot tb-slot-empty" data-slot="' + slot.index + '">' +
      '<div class="tb-slot-plus">+</div>' +
      '<div class="tb-slot-label">' + escapeHtml(slot.label) + '</div>' +
    '</div>';
  }
  var r = RARITY[card.rarity] || RARITY.common;
  return '<div class="tb-slot tb-slot-filled" data-slot="' + slot.index + '" ' +
    'style="border-color:' + r.color + '">' +
      '<div class="tb-slot-ovr" style="color:' + r.color + '">' + card.ovr + '</div>' +
      '<div class="tb-slot-name">' + escapeHtml((card.name || '').split(' ').slice(-1)[0]) + '</div>' +
      '<div class="tb-slot-label">' + escapeHtml(slot.label) + '</div>' +
    '</div>';
}

function renderTeamCoachHtml_(coach) {
  if (!coach) {
    return '<div class="tb-coach tb-coach-empty">' +
      '<div class="tb-coach-plus">+</div>' +
      '<div class="tb-coach-lbl">Выбрать тренера</div>' +
    '</div>';
  }
  var r = RARITY[coach.rarity] || RARITY.common;
  return '<div class="tb-coach tb-coach-filled" style="border-color:' + r.color + '">' +
    '<div class="tb-coach-ovr" style="color:' + r.color + '">' + coach.ovr + '</div>' +
    '<div class="tb-coach-name">' + escapeHtml(coach.name) + '</div>' +
  '</div>';
}

function openCardPicker(slotIndex) {
  var d = TEAM_STATE.data;
  if (!d) return;
  var slotDef = d.slots.filter(function (s) { return s.index === slotIndex; })[0];
  if (!slotDef) return;

  TEAM_STATE.pickingSlot = slotIndex;
  TEAM_STATE.pickingCoach = false;

  var cards = (d.cardsByGroup[slotDef.group] || []).slice();

  // Убираем карточки, уже поставленные в другие слоты
  var used = {};
  for (var idx in TEAM_STATE.tempSlots) {
    if (parseInt(idx, 10) !== slotIndex) used[TEAM_STATE.tempSlots[idx].cardId] = true;
  }
  cards = cards.filter(function (c) { return !used[c.cardId]; });

  renderCardPicker(cards, slotDef.group, slotDef.label);
}

function openCoachPicker() {
  var d = TEAM_STATE.data;
  if (!d) return;
  TEAM_STATE.pickingSlot = null;
  TEAM_STATE.pickingCoach = true;
  renderCardPicker(d.cardsByGroup['COACH'] || [], 'COACH', 'Тренер');
}

function renderCardPicker(cards, group, label) {
  var backdrop = document.getElementById('cardPickerModal');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'cardPickerModal';
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = '<div class="modal" id="cardPickerBody"></div>';
    backdrop.addEventListener('click', function (e) {
      if (e.target === backdrop) closeCardPicker();
    });
    document.body.appendChild(backdrop);
  }
  var body = document.getElementById('cardPickerBody');
  var html =
    '<div class="modal-head">' +
      '<h3>Выбор: ' + escapeHtml(label) + '</h3>' +
      '<button class="modal-close" onclick="closeCardPicker()">×</button>' +
    '</div>' +
    '<div class="modal-sub">Карточки из коллекции</div>';

  if (!cards.length) {
    html += '<div class="cmp-empty">Нет подходящих карточек.<br>' +
      'Откройте бокс в магазине, чтобы получить больше игроков.</div>';
  } else {
    html += '<div class="cp-list">';
    cards.forEach(function (c) {
      var r = RARITY[c.rarity] || RARITY.common;
      var initials = (c.name || '?').split(' ').map(function (x) { return x[0]; }).slice(0, 2).join('');
      var flag = COUNTRY_EMOJI[c.countryCode] || '🌍';
      html += '<div class="cp-item" data-card-id="' + c.cardId + '" ' +
        'style="border-color:' + r.color + '">' +
          '<div class="cp-avatar" style="background:linear-gradient(135deg,' +
            r.color + '44,' + r.color + '22)">' + escapeHtml(initials) +
            '<span class="cp-flag">' + flag + '</span></div>' +
          '<div class="cp-body">' +
            '<div class="cp-name">' + escapeHtml(c.name) + '</div>' +
            '<div class="cp-meta">' + escapeHtml(c.position) + ' · ' +
              escapeHtml(c.club || '') + '</div>' +
          '</div>' +
          '<div class="cp-ovr" style="color:' + r.color + '">' + c.ovr + '</div>' +
        '</div>';
    });
    html += '</div>';

    // Кнопка "убрать"
    if (TEAM_STATE.pickingSlot !== null && TEAM_STATE.tempSlots[TEAM_STATE.pickingSlot]) {
      html += '<button class="cp-remove-btn" onclick="removeSlotCard()">Убрать с позиции</button>';
    }
    if (TEAM_STATE.pickingCoach && TEAM_STATE.tempCoach) {
      html += '<button class="cp-remove-btn" onclick="removeCoach()">Убрать тренера</button>';
    }
  }

  body.innerHTML = html;
  backdrop.classList.add('show');

  body.querySelectorAll('.cp-item').forEach(function (el) {
    el.addEventListener('click', function () {
      var cardId = parseInt(el.dataset.cardId, 10);
      pickCard(cardId);
    });
  });
}

function pickCard(cardId) {
  var d = TEAM_STATE.data;
  if (!d) return;
  var allCards = [];
  for (var g in d.cardsByGroup) {
    allCards = allCards.concat(d.cardsByGroup[g]);
  }
  var card = allCards.filter(function (c) { return c.cardId === cardId; })[0];
  if (!card) return;

  if (TEAM_STATE.pickingCoach) {
    TEAM_STATE.tempCoach = card;
  } else if (TEAM_STATE.pickingSlot !== null) {
    TEAM_STATE.tempSlots[TEAM_STATE.pickingSlot] = card;
  }
  haptic('light');
  closeCardPicker();
  renderTeamBuilder();
}

function removeSlotCard() {
  if (TEAM_STATE.pickingSlot !== null) {
    delete TEAM_STATE.tempSlots[TEAM_STATE.pickingSlot];
  }
  closeCardPicker();
  renderTeamBuilder();
}

function removeCoach() {
  TEAM_STATE.tempCoach = null;
  closeCardPicker();
  renderTeamBuilder();
}

function closeCardPicker() {
  var m = document.getElementById('cardPickerModal');
  if (m) m.classList.remove('show');
}

function closeTeamBuilder() {
  var m = document.getElementById('teamBuilderModal');
  if (m) m.classList.remove('show');
}

function submitTeam() {
  var d = TEAM_STATE.data;
  if (!d) return;
  var teamName = (document.getElementById('teamNameInput').value || 'Моя команда').trim();
  var slots = [];
  for (var i = 0; i < 11; i++) {
    var c = TEAM_STATE.tempSlots[i];
    if (!c) { showToast('Заполните все позиции', 'error'); return; }
    slots.push({ index: i, cardId: c.cardId });
  }
  if (!TEAM_STATE.tempCoach) { showToast('Выберите тренера', 'error'); return; }

  var btn = document.getElementById('saveTeamBtn');
  btn.disabled = true; btn.textContent = 'Сохранение...';

  callServer('miniApp_saveTeam', CHAT_ID, USER_NAME, slots,
    TEAM_STATE.tempCoach.cardId, teamName)
    .then(function (res) {
      if (res && res.ok) {
        showToast('Команда сохранена!', 'success');
        haptic('medium');
        closeTeamBuilder();
      } else {
        showToast((res && res.error) || 'Ошибка', 'error');
        btn.disabled = false; btn.textContent = '💾 Сохранить команду';
      }
    });
}

/* ============================================================
   TEAM BATTLE UI
   ============================================================ */
function openTeamBattle() {
  var backdrop = document.getElementById('battleModal');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'battleModal';
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = '<div class="modal" id="battleModalBody"></div>';
    backdrop.addEventListener('click', function (e) {
      if (e.target === backdrop && !backdrop.dataset.busy) closeBattleModal();
    });
    document.body.appendChild(backdrop);
  }

  var body = document.getElementById('battleModalBody');
  body.innerHTML =
    '<div class="modal-head">' +
      '<h3>⚔️ Битва команд</h3>' +
      '<button class="modal-close" onclick="closeBattleModal()">×</button>' +
    '</div>' +
    '<div class="modal-sub">До 3 битв в день. Выиграешь — получишь 150 XP.</div>' +
    '<div id="battleContent">' +
      '<button class="notify-save-btn" id="startBattleBtn" onclick="startBattle()">Найти соперника</button>' +
    '</div>';

  backdrop.classList.add('show');
}

function startBattle() {
  var btn = document.getElementById('startBattleBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Поиск соперника...'; }
  haptic('medium');

  callServer('miniApp_startTeamBattle', CHAT_ID, USER_NAME).then(function (res) {
    var content = document.getElementById('battleContent');
    if (!content) return;
    if (!res || !res.ok) {
      content.innerHTML =
        '<div class="cmp-empty">' + escapeHtml((res && res.error) || '') + '</div>' +
        '<button class="notify-save-btn" onclick="startBattle()">Попробовать снова</button>';
      return;
    }
    renderBattleResult(res.result, res.xp);
  });
}

function renderBattleResult(result, xp) {
  var content = document.getElementById('battleContent');
  if (!content) return;

  var me = result.me;
  var opp = result.opponent;
  var score = result.score || { me: 0, opp: 0 };

  // === HTML поля ===
  var html = '';
  html += '<div class="battle-arena">';

  // Табло
  html += '<div class="battle-scoreboard">';
  html += '<div class="bs-num" id="bsMe">0</div>';
  html += '<div class="bs-sep">:</div>';
  html += '<div class="bs-num" id="bsOpp">0</div>';
  html += '</div>';

  // Поле
  html += '<div class="battle-pitch" id="battlePitch">';
  html += '<div class="pitch-center-line"></div>';
  html += '<div class="pitch-center-circle"></div>';
  html += '<div class="pitch-goal left"></div>';
  html += '<div class="pitch-goal right"></div>';
  html += '<div class="pitch-box left"></div>';
  html += '<div class="pitch-box right"></div>';

  // Иконки игроков
  html += '<div class="pitch-team-icons me">' +
    '<div class="pitch-team-dot"></div>'.repeat(3) +
  '</div>';
  html += '<div class="pitch-team-icons opp">' +
    '<div class="pitch-team-dot opp"></div>'.repeat(3) +
  '</div>';

  // Мяч
  html += '<div class="pitch-ball" id="pitchBall">⚽</div>';

  // Вспышка и текст
  html += '<div class="pitch-flash" id="pitchFlash"></div>';
  html += '<div class="pitch-goal-text" id="pitchGoalText"></div>';
  html += '</div>';

  // Команды
  html += '<div class="battle-teams-row">';
  html += '<div class="bt-team me">' +
    '<div class="bt-team-label">Ты</div>' +
    '<div class="bt-team-name">' + escapeHtml(me.team.teamName || 'Моя команда') + '</div>' +
    '<div class="bt-team-power">' + me.power.toFixed(1) + '</div>' +
  '</div>';
  html += '<div class="bt-vs">VS</div>';
  html += '<div class="bt-team opp">' +
    '<div class="bt-team-label">' +
      (opp.isBot ? '🤖 Бот' : 'Соперник') +
    '</div>' +
    '<div class="bt-team-name">' + escapeHtml(opp.team.teamName || opp.user) + '</div>' +
    '<div class="bt-team-power">' + opp.power.toFixed(1) + '</div>' +
  '</div>';
  html += '</div>';

  // Ход матча
  html += '<div class="battle-timeline" id="battleTimeline">' +
    'Матч начинается...' +
  '</div>';

  // Кнопка пропуска
  html += '<button class="battle-skip-btn" id="battleSkipBtn" onclick="skipBattleAnimation()">' +
    '⏩ Пропустить анимацию' +
  '</button>';

  html += '</div>'; // /.battle-arena

  content.innerHTML = html;

  // === Запуск анимации ===
  playBattleAnimation_(result, xp);
}

/* Флаг для пропуска */
var BATTLE_SKIP = false;

function skipBattleAnimation() {
  BATTLE_SKIP = true;
}

function playBattleAnimation_(result, xp) {
  var events = result.events || [];
  var meScore = 0, oppScore = 0;
  var bsMe = document.getElementById('bsMe');
  var bsOpp = document.getElementById('bsOpp');
  var ball = document.getElementById('pitchBall');
  var flash = document.getElementById('pitchFlash');
  var goalText = document.getElementById('pitchGoalText');
  var timeline = document.getElementById('battleTimeline');

  BATTLE_SKIP = false;

  function delay(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function updateScore(side) {
    if (side === 'me') {
      meScore++;
      if (bsMe) {
        bsMe.textContent = meScore;
        bsMe.classList.add('pop');
        setTimeout(function () { bsMe.classList.remove('pop'); }, 400);
      }
    } else {
      oppScore++;
      if (bsOpp) {
        bsOpp.textContent = oppScore;
        bsOpp.classList.add('pop');
        setTimeout(function () { bsOpp.classList.remove('pop'); }, 400);
      }
    }
  }

  function moveBall(targetLeft, targetTop) {
    if (!ball) return;
    ball.style.left = targetLeft + '%';
    ball.style.top = targetTop + '%';
    ball.classList.add('kick');
    setTimeout(function () { ball.classList.remove('kick'); }, 400);
  }

  function resetBall() {
    if (!ball) return;
    ball.style.left = '50%';
    ball.style.top = '50%';
  }

  function showGoalText(text, isGoal) {
    if (!goalText) return;
    goalText.textContent = text;
    goalText.className = 'pitch-goal-text' + (isGoal ? '' : ' miss');
    void goalText.offsetWidth; // reflow
    goalText.classList.add('show');
    setTimeout(function () { goalText.classList.remove('show'); }, 950);
  }

  function flashScreen(isGoal) {
    if (!flash) return;
    flash.className = 'pitch-flash' + (isGoal ? ' goal' : ' miss');
    setTimeout(function () { flash.className = 'pitch-flash'; }, 650);
  }

  function updateTimeline(text, isGoal) {
    if (!timeline) return;
    timeline.className = 'battle-timeline' +
      (isGoal === true ? ' goal' : (isGoal === false ? ' miss' : ''));
    timeline.innerHTML = text;
  }

  // === Основной цикл анимации ===
  (async function () {
    // Небольшая пауза на старт
    updateTimeline('<span class="tl-minute">0\'</span> Матч начался!');
    haptic('light');
    await delay(800);

    for (var i = 0; i < events.length; i++) {
      if (BATTLE_SKIP) break;

      var ev = events[i];
      var isMine = ev.attacker === 'me';

      // 1. Сообщение об атаке
      var attackText = '<span class="tl-minute">' + ev.minute + '\'</span> Атака ' +
        (isMine ? 'твоей команды' : 'соперника') + '...';
      updateTimeline(attackText);
      haptic('light');

      // 2. Мяч летит к воротам
      // Если моя атака — к правым воротам (соперника)
      // Если атака соперника — к левым (моим)
      var targetLeft = isMine ? 92 : 8;
      var targetTop = 45 + (Math.random() - 0.5) * 20; // ±10%
      moveBall(targetLeft, targetTop);

      await delay(450);
      if (BATTLE_SKIP) break;

      // 3. Результат
      if (ev.isGoal) {
        flashScreen(true);
        showGoalText('ГОЛ!', true);
        updateScore(ev.attacker);
        updateTimeline(
          '<span class="tl-minute">' + ev.minute + '\'</span> ' +
          '⚽ ГОЛ! Забивает ' + (isMine ? 'твоя команда' : 'соперник'),
          true
        );
        haptic('medium');
        await delay(900);

        // Мяч "в воротах" — оставляем там на пару секунд
        if (ball) ball.style.opacity = '0.3';
        await delay(300);
      } else {
        flashScreen(false);
        showGoalText(ev.hitPost ? 'ШТАНГА!' : 'МИМО!', false);
        updateTimeline(
          '<span class="tl-minute">' + ev.minute + '\'</span> ' +
          (ev.hitPost ? '🔩 Штанга! Не повезло' : '💨 Мимо ворот'),
          false
        );
        haptic('light');
        await delay(800);
      }

      if (BATTLE_SKIP) break;

      // 4. Возврат мяча в центр
      if (ball) ball.style.opacity = '1';
      resetBall();
      await delay(500);
    }

    // === Пропуск или завершение ===
    if (BATTLE_SKIP) {
      // Мгновенно показываем финальный счёт
      meScore = result.score ? result.score.me : 0;
      oppScore = result.score ? result.score.opp : 0;
      if (bsMe) bsMe.textContent = meScore;
      if (bsOpp) bsOpp.textContent = oppScore;
      updateTimeline('<span class="tl-minute">90\'</span> Матч завершён!');
    } else {
      updateTimeline('<span class="tl-minute">90\'</span> Финальный свисток!');
      await delay(600);
    }

    // === Показываем итог ===
    showBattleFinal_(result, xp);

    // Конфетти при победе
    if (result.outcome === 'win') {
      setTimeout(function () { showConfetti_(); }, 200);
    }

    if (xp && xp.leveledUp) {
      setTimeout(function () { showLevelUp(xp.level); }, 900);
    }
  })();
}

/* Показать финальный блок с результатом */
function showBattleFinal_(result, xp) {
  var content = document.getElementById('battleContent');
  if (!content) return;

  var outcomeLabel = {
    win: '🏆 ПОБЕДА!',
    lose: '😔 Поражение',
    draw: '🤝 Ничья'
  };
  var finalScore = result.score
    ? (result.score.me + ' : ' + result.score.opp)
    : '';

  var html = '';
  html += '<div class="battle-final ' + result.outcome + '">';
  html += '<div class="battle-final-title">' + outcomeLabel[result.outcome] + '</div>';
  html += '<div style="font-size:32px;font-weight:900;color:var(--accent);margin-bottom:6px">' +
    finalScore + '</div>';
  if (result.xpReward > 0) {
    html += '<div class="battle-final-xp">+' + result.xpReward + ' XP</div>';
  }
  html += '</div>';

  html += '<button class="notify-save-btn" style="margin-top:12px" onclick="startBattle()">' +
    '⚔️ Ещё битва' +
  '</button>';
  html += '<button class="cp-remove-btn" onclick="closeBattleModal()" ' +
    'style="margin-top:8px;background:var(--bg2);color:var(--text);border-color:var(--line)">' +
    'Закрыть' +
  '</button>';

  // Заменяем таймлайн на кнопки
  var timeline = document.getElementById('battleTimeline');
  var skipBtn = document.getElementById('battleSkipBtn');
  if (timeline) timeline.remove();
  if (skipBtn) skipBtn.remove();

  var arena = document.querySelector('.battle-arena');
  if (arena) {
    arena.insertAdjacentHTML('beforeend', html);
  }
}

/* Конфетти */
function showConfetti_() {
  var colors = ['#00e676', '#1de9b6', '#ffcc00', '#ff6ec7', '#a855f7'];
  for (var i = 0; i < 40; i++) {
    (function (idx) {
      setTimeout(function () {
        var c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.left = (Math.random() * 100) + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = (2 + Math.random() * 2) + 's';
        c.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(c);
        setTimeout(function () { c.remove(); }, 5000);
      }, idx * 30);
    })(i);
  }
}

function closeBattleModal() {
  var m = document.getElementById('battleModal');
  if (m) m.classList.remove('show');
}

bootstrap();
</script>
